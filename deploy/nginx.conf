# /etc/nginx/sites-available/sandoval
# SANDOVAL PRO — proxy a backend FastAPI/uvicorn en :3000.
# Headers de seguridad en snippets/sandoval-security-headers.conf
# CSP en snippets/sandoval-csp.conf

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

# Mapa para WebSocket upgrade (debe ir en contexto http antes de los servers)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → redirect HTTPS
server {
    if ($host = www.xn--mecnicarysandoval-8ob.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = xn--mecnicarysandoval-8ob.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name xn--mecnicarysandoval-8ob.com www.xn--mecnicarysandoval-8ob.com 187.77.62.67 _;
    return 301 https://$host$request_uri;




}

server {
    listen 443 ssl;
    server_name xn--mecnicarysandoval-8ob.com www.xn--mecnicarysandoval-8ob.com 187.77.62.67 _;
    ssl_certificate /etc/letsencrypt/live/xn--mecnicarysandoval-8ob.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/xn--mecnicarysandoval-8ob.com/privkey.pem; # managed by Certbot
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 2026-05-05 P0-F8 FIX: era 500M (DoS por uploads gigantes que comen disco).
    # La app valida individualmente: facturas 12MB, evidencia 50MB, OCR base64
    # 12MB. 50M global cubre el caso más grande con margen razonable y bloquea
    # uploads abusivos a nivel proxy ANTES de llegar a uvicorn.
    client_max_body_size 50M;
    server_tokens off;

    # ── Security headers globales ──────────────────────────────────────
    # Nota: nginx NO hereda add_header en bloques anidados con add_header
    # propio. Por eso cada location HTML las re-incluye explícitamente.
    include snippets/sandoval-security-headers.conf;

    # ── LOGIN (rate limit estricto anti-bruteforce) ────────────────────
    location = /api/login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include snippets/sandoval-security-headers.conf;
    }

    # ── ADMIN SPA (HTML estático servido por nginx directo) ────────────
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        alias /var/www/sandoval/static/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        include snippets/sandoval-security-headers.conf;
        include snippets/sandoval-csp.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        etag off;
        if_modified_since off;
        add_header Last-Modified "";
    }

    # ── API admin SPA (JWT) ────────────────────────────────────────────
    location /admin/api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        include snippets/sandoval-security-headers.conf;
    }

    # ── API PWA + cliente (sesión SQLite) ──────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include snippets/sandoval-security-headers.conf;
    }

    # ── ESTÁTICOS PUBLICOS ─────────────────────────────────────────────
    location /assets/ {
        alias /var/www/sandoval/assets/;
        # Tipos MIME correctos para fuentes (nginx default no los conoce)
        types {
            font/ttf   ttf;
            font/otf   otf;
            font/woff2 woff2;
            font/woff  woff;
            text/css   css;
            image/svg+xml svg;
            image/png  png;
            image/jpeg jpg jpeg;
        }
        default_type application/octet-stream;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # cross-origin permisivo para fuentes (mismo origen pero algunos browsers lo exigen)
        add_header Access-Control-Allow-Origin "https://xn--mecnicarysandoval-8ob.com" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, immutable, max-age=2592000" always;
    }
    location /pdfs/ {
        alias /var/www/sandoval/pdfs/;
        include snippets/sandoval-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location /evidencia/ {
        alias /var/www/sandoval/static/evidencia/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
    }
    location /static/evidencia/ {
        alias /var/www/sandoval/static/evidencia/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
    }
    location /facturas/ {
        alias /var/www/sandoval/static/facturas/;
        include snippets/sandoval-security-headers.conf;
        # 2026-04-30 fix: forzar revalidacion para evitar negative cache 403
        add_header Cache-Control 'no-cache, must-revalidate' always;
        expires off;
    }

    # ── PWA móvil ──────────────────────────────────────────────────────

    # ── Atajos URL nuevos (para evitar cache HTTP del browser) ─────────
    # /m/  → PWA movil (admin staff)  ·  /pc/ → SPA admin PC
    location = /m/ {
        return 302 /app/?fresh=$msec;
    }
    location = /m {
        return 302 /app/?fresh=$msec;
    }
    location = /pc/ {
        return 302 /admin/?force_pc=1&fresh=$msec;
    }
    location = /pc {
        return 302 /admin/?force_pc=1&fresh=$msec;
    }

    location /app/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include snippets/sandoval-security-headers.conf;
        include snippets/sandoval-csp.conf;
    }

    # ── Portal Cliente (PWA estática) ──────────────────────────────────
    location /portal/ {
        alias /var/www/sandoval/portal-cliente/;
        index index.html;
        
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        include snippets/sandoval-security-headers.conf;
        include snippets/sandoval-csp.conf;
    }

    # ── Páginas HTML públicas (root, /login, /portal, /aprobacion, etc) ─
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        proxy_send_timeout 120;
        # WebSocket support (PWA puede usar push/notifications)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        include snippets/sandoval-security-headers.conf;
        include snippets/sandoval-csp.conf;
    }


}

