server {
    listen 80;
    # Pon tu dominio aquí. Si no tienes, pon la IP del VPS:
    server_name tu-dominio.com www.tu-dominio.com;

    # Límite de carga de archivos (para subir evidencias/fotos)
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Necesario para WebSockets (NiceGUI los usa)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout generoso para conexiones largas
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # Archivos estáticos (servidos directamente por Nginx, más rápido)
    location /assets/ {
        alias /var/www/sandoval/assets/;
        expires 7d;
    }

    location /pdfs/ {
        alias /var/www/sandoval/pdfs/;
    }

    location /evidencia/ {
        alias /var/www/sandoval/static/evidencia/;
    }
}
