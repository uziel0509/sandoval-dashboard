<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Sandoval — Portal</title>
  <link rel="manifest" href="/app/manifest.json">
  <link rel="icon" href="/assets/logo_sandoval.jpg">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --blue:#007aff;--blue-light:#e8f4ff;--blue-mid:#bfd7ff;
      --green:#34c759;--green-light:#e3f9ea;
      --amber:#ff9f0a;--amber-light:#fff6e5;
      --red:#ff3b30;--red-light:#fff0f0;
      --purple:#af52de;--purple-light:#f5eeff;
      --bg:#f2f2f7;--card:#ffffff;--border:#e5e5ea;
      --text:#1c1c1e;--text2:#636366;--text3:#aeaeb2;
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    html,body{background:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;overscroll-behavior:none;min-height:100vh;color:var(--text)}
    input,select,textarea,button{font-family:inherit}
    input,select,textarea{font-size:15px;width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);outline:none}
    input:focus,select:focus,textarea:focus{border-color:var(--blue)}
    .hidden{display:none!important}

    /* APP SHELL */
    #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.08)}
    #content{flex:1;padding-bottom:calc(72px + var(--safe-bottom))}

    /* SPLASH */
    #loading{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .3s}
    .sp-logo{width:80px;height:80px;background:var(--blue);border-radius:22px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
    .sp-logo span{font-size:36px;font-weight:700;color:#fff}
    .sp-name{font-size:20px;font-weight:600;color:var(--text);margin-bottom:6px}
    .sp-sub{font-size:14px;color:var(--text3);margin-bottom:32px}
    .sp-bar{width:140px;height:3px;background:#f2f2f7;border-radius:2px;overflow:hidden}
    .sp-fill{height:100%;background:var(--blue);border-radius:2px;animation:spload 2s ease forwards}
    @keyframes spload{from{width:0}to{width:100%}}

    /* LOGIN */
    #login-screen{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:500;padding:32px 24px}
    .lg-logo{width:64px;height:64px;background:var(--blue);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
    .lg-logo span{font-size:26px;font-weight:700;color:#fff}
    .lg-title{font-size:22px;font-weight:700;color:var(--text);text-align:center;margin-bottom:6px}
    .lg-sub{font-size:14px;color:var(--text3);text-align:center;margin-bottom:32px}
    .lg-card{width:100%;max-width:360px}
    .lg-tabs{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:2px;margin-bottom:22px}
    .lg-tab{flex:1;padding:9px;text-align:center;border-radius:10px;font-size:14px;font-weight:500;color:var(--text3);border:none;background:transparent;cursor:pointer}
    .lg-tab.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.1)}
    .lg-label{font-size:12px;font-weight:500;color:var(--text2);display:block;margin-bottom:6px}
    .lg-input{margin-bottom:14px;border-radius:12px;background:var(--bg);border:1px solid var(--border)}
    .lg-input:focus{background:#fff;border-color:var(--blue)}
    .lg-btn{width:100%;padding:15px;background:var(--blue);border:none;border-radius:14px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px}
    .lg-btn:active{opacity:.85}
    .lg-hint{font-size:12px;color:var(--text3);text-align:center;margin-top:12px}
    .lg-err{font-size:13px;color:var(--red);text-align:center;margin-top:12px;font-weight:500}

    /* TOPBAR */
    .topbar{background:#fff;padding:14px 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid var(--border);position:sticky;top:0;z-index:100}
    .tb-brand{display:flex;align-items:center;gap:10px}
    .tb-logo{width:34px;height:34px;background:var(--blue);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700}
    .tb-name{font-size:14px;font-weight:600;color:var(--text)}
    .tb-sub{font-size:11px;color:var(--text3)}
    .tb-avatar{width:32px;height:32px;border-radius:50%;background:var(--blue-light);display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:11px;font-weight:700;cursor:pointer}
    .tb-page{font-size:16px;font-weight:600;color:var(--text);flex:1}

    /* GREETING HEADER (cliente) */
    .greeting{background:#fff;padding:18px 18px 14px;border-bottom:0.5px solid var(--border)}
    .gr-hi{font-size:13px;color:var(--text3);margin-bottom:2px}
    .gr-name{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.3px}

    /* HERO CARD */
    .hero-wrap{padding:12px 14px 4px}
    .hero{background:var(--text);border-radius:22px;padding:20px;position:relative;overflow:hidden}
    .hero-circle1{position:absolute;width:180px;height:180px;border-radius:50%;background:#ffffff06;top:-50px;right:-40px}
    .hero-circle2{position:absolute;width:90px;height:90px;border-radius:50%;background:#ffffff04;bottom:-20px;left:10px}
    .hero-lbl{font-size:10px;color:#ffffff50;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:8px}
    .hero-plate{font-size:28px;font-weight:700;color:#fff;letter-spacing:.8px;margin-bottom:3px}
    .hero-model{font-size:13px;color:#ffffff70;margin-bottom:18px}
    .hero-phases{display:flex;align-items:center;gap:3px;margin-bottom:6px}
    .hp{flex:1;height:3px;border-radius:1.5px;background:#ffffff20}
    .hp.done{background:#fff}
    .hp.active{background:var(--blue)}
    .hero-pname{font-size:11px;color:#ffffff60;text-align:center}
    .hero-badge{position:absolute;top:20px;right:20px;background:var(--blue);border-radius:20px;padding:4px 12px;font-size:10px;font-weight:600;color:#fff}

/* STATS */
    .stats{display:flex;gap:8px;padding:12px 14px 4px}
    .stat{flex:1;background:#fff;border-radius:16px;padding:14px 10px;text-align:center}
    .stat-n{font-size:20px;font-weight:700;color:var(--text);line-height:1}
    .stat-l{font-size:10px;color:var(--text3);margin-top:4px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
    .stat-n.blue{color:var(--blue)}
    .stat-n.green{color:var(--green)}
    .stat-n.amber{color:var(--amber);font-size:14px}

    /* SECTION */
    .sec{padding:14px 14px 4px}
    .sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .sec-title{font-size:16px;font-weight:600;color:var(--text)}
    .sec-link{font-size:14px;color:var(--blue);font-weight:500;cursor:pointer}

    /* ORDER CARD */
    .oc{background:#fff;border-radius:20px;padding:16px;margin-bottom:10px;cursor:pointer}
    .oc:active{opacity:.92}
    .oc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
    .oc-plate{font-size:18px;font-weight:700;color:var(--text);letter-spacing:.3px}
    .oc-id{font-size:10px;color:var(--text3);margin-top:2px}
    .oc-title{font-size:13px;color:var(--text2);margin-bottom:12px}
    .oc-steps{display:flex;align-items:center;gap:3px;margin-bottom:10px}
    .sd{width:24px;height:24px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .sd svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .sa{width:24px;height:24px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 0 4px #007aff22}
    .sa-dot{width:8px;height:8px;background:#fff;border-radius:50%}
    .sp{width:24px;height:24px;border-radius:50%;background:var(--bg);border:1.5px solid var(--border);flex-shrink:0}
    .sl{height:2px;flex:1;background:var(--border)}
    .sl.done{background:var(--blue)}
    .oc-foot{display:flex;justify-content:space-between;align-items:center}
    .oc-phase{font-size:11px;color:var(--text3)}
    .oc-pct{font-size:11px;font-weight:700;color:var(--blue)}
    .oc-amt{font-size:12px;font-weight:700;color:var(--green)}

    /* FLEET CARD */
    .fc{background:#fff;border-radius:20px;padding:16px;margin-bottom:10px;cursor:pointer}
    .fc-plate{font-size:20px;font-weight:700;color:var(--text);letter-spacing:.3px;margin-bottom:2px}
    .fc-model{font-size:12px;color:var(--text3);margin-bottom:10px}
    .fc-bar{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin-bottom:6px}
    .fc-fill{height:100%;border-radius:3px;background:var(--blue)}
    .fc-foot{display:flex;justify-content:space-between}
    .fc-foot span{font-size:11px;color:var(--text3)}

    /* HIST ROW */
    .hr{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:0.5px solid var(--bg);cursor:pointer}
    .hr:last-child{border-bottom:none}
    .hr-id{font-size:10px;color:var(--text3);margin-bottom:3px}
    .hr-desc{font-size:14px;font-weight:500;color:var(--text)}
    .hr-meta{font-size:11px;color:var(--text3);margin-top:2px}
    .hr-amt{font-size:14px;font-weight:700;color:var(--text);text-align:right}

    /* BADGES */
    .badge{display:inline-block;font-size:10px;font-weight:600;padding:4px 11px;border-radius:20px;white-space:nowrap}
    .b-blue{background:var(--blue-light);color:var(--blue)}
    .b-green{background:var(--green-light);color:#1a7a35}
    .b-amber{background:var(--amber-light);color:#b36200}
    .b-gray{background:var(--bg);color:var(--text2)}
    .b-purple{background:var(--purple-light);color:var(--purple)}
    .chip{display:inline-block;font-size:10px;font-weight:600;padding:4px 11px;border-radius:20px;white-space:nowrap}
    .estado-RECEPCI\00F3N,.estado-RECEPCION{background:var(--bg);color:var(--text2)}
    .estado-DIAGN\00D3STICO,.estado-DIAGNOSTICO{background:var(--purple-light);color:var(--purple)}
    .estado-REPUESTOS{background:var(--amber-light);color:#b36200}
    .estado-APROBACI\00F3N,.estado-APROBACION{background:var(--amber-light);color:#b36200}
    .estado-REPARACI\00F3N,.estado-REPARACION{background:var(--blue-light);color:var(--blue)}
    .estado-CONTROL{background:#e0faff;color:#0066aa}
    .estado-ENTREGA,.estado-LISTO{background:var(--green-light);color:#1a7a35}
    .estado-ENTREGADO{background:var(--green-light);color:#1a7a35}
    .estado-ARCHIVADO{background:var(--green-light);color:#1a7a35}
    .estado-programada{background:var(--blue-light);color:var(--blue)}
    .estado-confirmada{background:var(--green-light);color:#1a7a35}
    .estado-cancelada{background:var(--red-light);color:var(--red)}

    /* BOTTOM NAV */
    #bottom-nav{background:#fff;border-top:0.5px solid var(--border);display:flex;padding:8px 0;padding-bottom:max(env(safe-area-inset-bottom,8px),8px);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:9999;box-shadow:0 -1px 0 rgba(0,0,0,.06)}
    .nt{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:2px 0}
    .nt svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .nt span{font-size:10px;font-weight:500}
    .nt.active{color:var(--blue)}
    .nt:not(.active){color:var(--text3)}

    /* MODAL DETALLE */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:flex-end;justify-content:center}
    .modal-sheet{background:#fff;border-radius:26px 26px 0 0;width:100%;max-width:430px;max-height:94vh;overflow-y:auto;padding-bottom:max(var(--safe-bottom),20px)}
    .ms-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:14px auto 16px}

    /* DETALLE HEADER */
    .dh{padding:0 18px 16px;border-bottom:0.5px solid var(--bg)}
    .dh-id{font-size:11px;color:var(--text3);font-weight:500;letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px}
    .dh-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:10px;line-height:1.25}
    .dh-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
    .dh-chip{background:var(--bg);border-radius:8px;padding:5px 10px;font-size:11px;color:var(--text2);font-weight:500}
    .dh-prog{margin-top:4px}
    .dh-prog-top{display:flex;justify-content:space-between;margin-bottom:6px}
    .dh-prog-lbl{font-size:12px;font-weight:500;color:var(--text)}
    .dh-prog-pct{font-size:12px;font-weight:700;color:var(--blue)}
    .prog-track{height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
    .prog-fill{height:100%;border-radius:3px;background:var(--blue)}

    /* STEPPER HORIZONTAL */
    .stepper-card{background:#fff;margin:10px 14px 0;border-radius:16px;padding:14px 16px;border-top:0.5px solid var(--bg)}
    .st-row{display:flex;align-items:center;margin-bottom:8px}
    .std{width:26px;height:26px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .std svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .sta{width:26px;height:26px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 0 4px #007aff22}
    .stp{width:26px;height:26px;border-radius:50%;background:var(--bg);border:1.5px solid var(--border);font-size:9px;font-weight:700;color:var(--text3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .st-line{height:2px;flex:1;background:var(--border)}
    .st-line-done{background:var(--blue)}
    .st-labels{display:flex;justify-content:space-between}
    .st-labels span{font-size:8px;font-weight:500;color:var(--text3);text-align:center;width:26px;line-height:1.3}
    .st-labels span.done{color:var(--blue)}
    .st-labels span.cur{color:var(--blue);font-weight:700}
/* FASES ACORDEÓN */
    .phases-wrap{margin:0 14px}
    .phase-card{background:#fff;border-radius:20px;overflow:hidden;margin-bottom:10px}
    .phase-item{border-bottom:0.5px solid var(--bg);cursor:pointer}
    .phase-item:last-child{border-bottom:none}
    .ph-header{display:flex;align-items:center;gap:10px;padding:14px 16px}
    .ph-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .ph-dot-done{background:var(--blue)}
    .ph-dot-done svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .ph-dot-now{background:#fff;border:2px solid var(--blue);box-shadow:0 0 0 3px #007aff20}
    .ph-dot-now-in{width:9px;height:9px;background:var(--blue);border-radius:50%}
    .ph-dot-wait{background:var(--bg);border:1.5px solid var(--border);font-size:9px;font-weight:700;color:var(--text3);display:flex;align-items:center;justify-content:center}
    .ph-info{flex:1}
    .ph-name{font-size:14px;font-weight:500;color:var(--text)}
    .ph-name.now{color:var(--blue);font-weight:600}
    .ph-name.wait{color:var(--text3)}
    .ph-time{font-size:11px;color:var(--text3);margin-top:2px}
    .ph-chevron{font-size:18px;color:var(--text3);width:20px;text-align:center;transition:transform .2s;line-height:1;flex-shrink:0}
    .ph-chevron.open{transform:rotate(90deg);color:var(--blue)}
    .ph-body{display:none;padding:0 16px 16px}
    .ph-body.open{display:block}

    /* NOTA TÉCNICA */
    .ph-note{background:var(--blue-light);border-radius:12px;padding:12px 14px;margin-bottom:12px}
    .ph-note-lbl{font-size:9px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
    .ph-note-txt{font-size:13px;color:#1a3a6a;line-height:1.6}

    /* APROBACIÓN OK */
    .ph-aprobado{background:var(--green-light);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px}
    .ph-aprobado svg{width:18px;height:18px;stroke:#1a7a35;fill:none;stroke-width:2.5;stroke-linecap:round;flex-shrink:0}
    .ph-aprobado span{font-size:13px;color:#1a7a35;font-weight:500}

    /* APROBACIÓN PENDIENTE */
    .ph-pendiente{background:var(--amber-light);border-radius:12px;padding:12px 14px;margin-bottom:12px}
    .ph-pendiente-title{font-size:13px;font-weight:600;color:#b36200;margin-bottom:4px}
    .ph-pendiente-sub{font-size:12px;color:#8a5000;margin-bottom:10px}
    .btn-aprobar{width:100%;padding:13px;background:var(--blue);border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px}
    .btn-posponer{width:100%;padding:11px;background:transparent;border:1.5px solid var(--border);border-radius:12px;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer}

    /* EVIDENCIA GRID */
    .ev-lbl{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
    .ev-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
    .ev-grid.single{grid-template-columns:1fr}
    .ev-item{aspect-ratio:4/3;border-radius:14px;overflow:hidden;cursor:pointer;position:relative;background:var(--bg)}
    .ev-img{width:100%;height:100%;object-fit:cover;display:block}
    .ev-video-wrap{width:100%;height:100%;background:#1c1c2e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
    .ev-play{width:40px;height:40px;background:rgba(255,255,255,.9);border-radius:50%;display:flex;align-items:center;justify-content:center}
    .ev-play svg{width:14px;height:14px;fill:#1c1c1e;margin-left:3px}
    .ev-video-lbl{font-size:10px;color:rgba(255,255,255,.65);font-weight:500}
    .ev-duration{position:absolute;bottom:7px;right:8px;background:rgba(0,0,0,.6);border-radius:6px;padding:2px 7px;font-size:9px;color:#fff;font-weight:600}
    .ev-placeholder{width:100%;height:100%;background:linear-gradient(135deg,#e8e0d4,#c9bfb0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
    .ev-placeholder svg{width:22px;height:22px;stroke:rgba(255,255,255,.8);fill:none;stroke-width:1.5;stroke-linecap:round}
    .ev-placeholder span{font-size:10px;color:rgba(255,255,255,.85);font-weight:500;text-align:center;padding:0 8px}

    /* PRESUPUESTO EN FASE */
    .ph-budget{background:var(--bg);border-radius:14px;overflow:hidden}
    .pb-row{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border-bottom:0.5px solid #e8e8ed;gap:8px}
    .pb-row:last-of-type{border-bottom:none}
    .pb-name{font-size:13px;color:var(--text2);flex:1}
    .pb-qty{font-size:11px;color:var(--text3);background:#e5e5ea;border-radius:6px;padding:2px 7px;white-space:nowrap}
    .pb-val{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap}
    .pb-total{background:var(--blue);padding:13px;display:flex;justify-content:space-between;align-items:center}
    .pb-total-lbl{font-size:14px;font-weight:600;color:#fff}
    .pb-total-val{font-size:18px;font-weight:700;color:#fff}

    /* WA BTN */
    .wa-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;background:#25d366;border:none;border-radius:16px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:4px}
    .wa-btn svg{width:20px;height:20px;fill:#fff;flex-shrink:0}

    /* FORM */
    .form-card{background:#fff;border-radius:20px;padding:18px;margin-bottom:10px}
    .field{margin-bottom:14px}
    .field label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px}
    .btn-primary{width:100%;padding:15px;background:var(--blue);border:none;border-radius:14px;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
    .btn-primary:active{opacity:.85}

    /* TOAST */
    .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:12px 22px;border-radius:14px;font-size:13px;font-weight:600;z-index:9999;white-space:nowrap;animation:toastIn .25s ease}
    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

    /* EMPTY */
    .empty{text-align:center;padding:50px 20px}
    .empty-icon{font-size:52px;margin-bottom:14px}
    .empty-title{font-size:17px;font-weight:600;color:var(--text);margin-bottom:8px}
    .empty-sub{font-size:14px;color:var(--text3)}

    /* SLIDE UP */
    .slide-up{animation:slideUp .2s ease}
    @keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

    /* CITAS */
    .cita-card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;border-left:3px solid var(--blue)}
    .cita-card.cancelada{border-left-color:var(--red)}
    .cita-card.confirmada{border-left-color:var(--green)}
  </style></head>
<body>

  <!-- SPLASH -->
  <div id="loading">
    <div class="sp-logo"><span>S</span></div>
    <p class="sp-name">Mecánica Sandoval</p>
    <p class="sp-sub">Portal del cliente</p>
    <div class="sp-bar"><div class="sp-fill"></div></div>
  </div>

  <!-- LOGIN -->
  <div id="login-screen" class="hidden">
    <div class="lg-logo"><span>S</span></div>
    <p class="lg-title">Mecánica Sandoval</p>
    <p class="lg-sub">Ingresa a tu portal</p>
    <div class="lg-card">
      <div class="lg-tabs">
        <button id="tab-staff" class="lg-tab on" onclick="switchLoginTab('staff')">Personal</button>
        <button id="tab-cliente" class="lg-tab" onclick="switchLoginTab('cliente')">Cliente</button>
      </div>
      <div id="panel-staff">
        <div class="field"><label class="lg-label">Usuario</label><input id="staff-user" class="lg-input" type="text" placeholder="tu usuario" autocomplete="username"></div>
        <div class="field"><label class="lg-label">Contraseña</label><input id="staff-pass" class="lg-input" type="password" placeholder="••••••" autocomplete="current-password"></div>
        <button onclick="doLogin('staff')" class="lg-btn">Iniciar sesión</button>
      </div>
      <div id="panel-cliente" class="hidden">
        <div class="field"><label class="lg-label">Placa del vehículo</label><input id="cli-placa" class="lg-input" type="text" placeholder="ABC-123" style="text-transform:uppercase"></div>
        <div class="field"><label class="lg-label">Contraseña</label><input id="cli-pass" class="lg-input" type="password" placeholder="Tu DNI o RUC"></div>
        <button onclick="doLogin('cliente')" class="lg-btn">Ingresar al portal</button>
        <p class="lg-hint">Contraseña inicial: tu DNI o RUC</p>
      </div>
      <p id="login-error" class="lg-err hidden"></p>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">
    <!-- TOPBAR CLIENTE -->
    <div id="topbar-cliente" class="hidden">
      <div class="greeting">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div class="gr-hi">Bienvenido de nuevo,</div>
            <div class="gr-name" id="gr-name">Cliente</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <div class="tb-avatar" id="user-badge">?</div>
            <button onclick="logout()" style="background:none;border:none;color:var(--text3);cursor:pointer;padding:4px">
              <span class="material-icons-round" style="font-size:20px">logout</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- TOPBAR ADMIN -->
    <div id="topbar-admin" class="topbar hidden">
      <div class="tb-brand">
        <div class="tb-logo">S</div>
        <div><div class="tb-name" id="topbar-section">Dashboard</div></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="tb-avatar" id="user-badge-admin">?</div>
        <button onclick="logout()" style="background:none;border:none;color:var(--text3);cursor:pointer;padding:4px">
          <span class="material-icons-round" style="font-size:20px">logout</span>
        </button>
      </div>
    </div>

    <!-- HERO SECTION (cliente) -->
    <div id="hero-section" class="hidden"></div>

    <!-- CONTENT -->
    <div id="content"></div>

    <!-- BOTTOM NAV -->
    <nav id="bottom-nav"></nav>
  </div>

  <script>
  // ── INIT ──────────────────────────────────────────────────────────

  var S={token:localStorage.getItem('s_token'),user:JSON.parse(localStorage.getItem('s_user')||'null'),page:''};

  async function apiFetch(path,opts){
    opts=opts||{};
    var res=await fetch(path,{headers:Object.assign({'Authorization':'Bearer '+S.token,'Content-Type':'application/json'},opts.headers||{}),body:opts.body,method:opts.method||'GET'});
    if(res.status===401){logout();return null;}
    return res.json();
  }

  function toast(msg,color){
    color=color||'#1c1c1e';
    var el=document.createElement('div');el.className='toast';el.style.background=color;el.textContent=msg;
    document.body.appendChild(el);setTimeout(function(){el.remove();},2800);
  }
  function toastOk(m){toast('\u2713 '+m,'#1a7a35');}
  function toastErr(m){toast('\u2717 '+m,'#b91c1c');}

  function fmtDate(d){
    if(!d)return'—';
    var s=String(d).trim();
    // Formato DD/MM/YYYY (fechas historicas importadas)
    if(/^\d{2}\/\d{2}\/\d{4}/.test(s)){
      var p=s.split('/');
      return p[0]+'/'+p[1]+'/'+p[2].slice(0,4);
    }
    // Formato YYYY-MM-DD o datetime
    var dt=new Date(s.replace(' ','T'));
    if(isNaN(dt)) return s.slice(0,10);
    return dt.toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit',year:'numeric'});
  }
  function fmtMoney(n){return'S/ '+Number(n||0).toLocaleString('es-PE',{minimumFractionDigits:2});}

  function getStatus(estado){
    var e=(estado||'').toUpperCase();
    if(e.includes('ARCHIV')||e.includes('ENTREGADO')||e==='ENTREGA')return{bg:'#e3f9ea',fg:'#1a7a35',bar:'#34c759',lbl:'Completada'};
    if(e.includes('LISTO')||e.includes('CONTROL'))return{bg:'#e0faff',fg:'#0066aa',bar:'#007aff',lbl:'Listo'};
    if(e.includes('REPARAC')||e.includes('EN PROCESO'))return{bg:'#e8f4ff',fg:'#007aff',bar:'#007aff',lbl:'En reparación'};
    if(e.includes('APROB'))return{bg:'#fff6e5',fg:'#b36200',bar:'#ff9f0a',lbl:'Por aprobar'};
    if(e.includes('REPUEST')||e.includes('COTIZ'))return{bg:'#fff6e5',fg:'#b36200',bar:'#ff9f0a',lbl:'Presupuesto'};
    if(e.includes('DIAGN'))return{bg:'#f5eeff',fg:'#7c3aed',bar:'#af52de',lbl:'Diagnóstico'};
    return{bg:'#f2f2f7',fg:'#636366',bar:'#aeaeb2',lbl:'Recepción'};
  }

  var PHASES=[
    {id:'RECEPCION',label:'Recepción',short:'Recep.'},
    {id:'DIAGNOSTICO',label:'Diagnóstico',short:'Diagn.'},
    {id:'REPUESTOS',label:'Presupuesto',short:'Presup.'},
    {id:'APROBACION',label:'Aprobación',short:'Aprobac.'},
    {id:'REPARACION',label:'Reparación',short:'Repar.'},
    {id:'CONTROL',label:'Control Calidad',short:'Control'},
    {id:'ENTREGA',label:'Entrega',short:'Entrega'}
  ];

  function phaseIdx(estado){
    var e=(estado||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    var map={RECEPCION:0,DIAGNOSTICO:1,REPUESTOS:2,COTIZACION:2,APROBACION:3,REPARACION:4,'EN PROCESO':4,CONTROL:5,'CONTROL CALIDAD':5,ENTREGA:6,ENTREGADO:7,ARCHIVADO:7};
    for(var k in map){if(e.includes(k))return map[k];}
    return 0;
  }

  function itemsTotal(o){
    try{var items=typeof o.items_cotizacion==='string'?JSON.parse(o.items_cotizacion||'[]'):(o.items_cotizacion||[]);return items.reduce(function(s,it){return s+parseFloat(it.total||0);},0);}
    catch(e){return 0;}
  }

  function chip(estado){
    if(!estado)return'';
    var n=estado==='ARCHIVADO'?'ENTREGADO':estado;
    return'<span class="chip estado-'+n+'">'+n+'</span>';
  }

  // ── NAV ───────────────────────────────────────────────────────────
  var CLIENT_NAV=[
    {page:'mis-ordenes',icon:'<svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>',label:'Órdenes'},
    {page:'mi-flota',icon:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>',label:'Flota'},
    {page:'historial',icon:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg>',label:'Historial'},
    {page:'mis-citas',icon:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',label:'Citas'},
    {page:'agendar',icon:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 3"/></svg>',label:'Agendar'}
  ];
  var ADMIN_NAV=[
    {icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>',label:'Nueva Orden',page:'nueva-orden'},
    {page:'dashboard',icon:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',label:'Dashboard'},
    {page:'ordenes',icon:'<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',label:'Órdenes'},
    {page:'clientes',icon:'<svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/><path d="M16 11a4 4 0 010 8"/><path d="M21 21v-2a4 4 0 00-3-3.87"/></svg>',label:'Clientes'},
    {page:'inventario',icon:'<svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>',label:'Inventario'},
    {page:'notas',icon:'<svg viewBox="0 0 24 24"><path d="M6 2h12a2 2 0 012 2v16a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2z"/><path d="M9 9h6M9 13h4"/></svg>',label:'Ventas'},
    {page:'reportes',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',label:'Reportes'}
  ];

  function isAdmin(){return S.user&&['admin','recepcionista','tecnico'].includes(S.user.rol);}

  function setPage(name){
    S.page=name;
    document.querySelectorAll('.nt').forEach(function(t){t.classList.toggle('active',t.dataset.page===name);});
    renderPage(name);
    window.scrollTo(0,0);
  }

  function buildNav(items){
    document.getElementById('bottom-nav').innerHTML=items.map(function(it){
      return'<button class="nt'+(S.page===it.page?' active':'')+'" data-page="'+it.page+'" onclick="setPage(\''+it.page+'\')"> '+it.icon+'<span>'+it.label+'</span></button>';
    }).join('');
  }
  </script>

  <script>
  // ── HERO ─────────────────────────────────────────────────────────
  function buildHero(ordenes){
    var hero=document.getElementById('hero-section');
    if(!ordenes||!ordenes.length){hero.classList.add('hidden');return;}
    var o=ordenes.find(function(x){return!['ARCHIVADO','ENTREGADO'].includes((x.estado||'').toUpperCase());})||ordenes[0];
    var si=getStatus(o.estado);
    var idx=phaseIdx(o.estado);
    var pct=Math.round((idx/Math.max(PHASES.length-1,1))*100);
    var prev=idx>0?PHASES[idx-1].short:'';
    var cur=PHASES[Math.min(idx,PHASES.length-1)].short;
    var next=idx<PHASES.length-1?PHASES[idx+1].short:'';
    var modelo=[(o.vehiculo_marca||''),(o.vehiculo_modelo||'')].filter(Boolean).join(' ')||'Vehículo';
    var phases=PHASES.map(function(p,i){
      var cls=i<idx?'done':i===idx?'active':'';
      return'<div class="hp'+' '+cls+'"></div>';
    }).join('');
    hero.innerHTML='<div class="hero-wrap"><div class="hero"><div class="hero-circle1"></div><div class="hero-circle2"></div>'
      +'<div class="hero-badge">'+si.lbl+'</div>'
      +'<div class="hero-lbl">Orden activa</div>'
      +'<div class="hero-plate">'+(o.vehiculo_placa||'—')+'</div>'
      +'<div class="hero-model">'+modelo+'</div>'
      +'<div class="hero-phases">'+phases+'</div>'
      +'<div class="hero-pname">'+cur+' · paso '+(idx+1)+' de '+PHASES.length+'</div>'
      +'</div></div>';
    hero.classList.remove('hidden');
  }

  // ── LOGIN ─────────────────────────────────────────────────────────
  function switchLoginTab(tab){
    var isStaff=tab==='staff';
    document.getElementById('panel-staff').classList.toggle('hidden',!isStaff);
    document.getElementById('panel-cliente').classList.toggle('hidden',isStaff);
    document.getElementById('tab-staff').className='lg-tab'+(isStaff?' on':'');
    document.getElementById('tab-cliente').className='lg-tab'+(!isStaff?' on':'');
  }

  async function doLogin(tipo){
    var body=tipo==='staff'
      ?{tipo:'staff',username:document.getElementById('staff-user').value.trim(),password:document.getElementById('staff-pass').value}
      :{tipo:'cliente',placa:document.getElementById('cli-placa').value.trim().toUpperCase(),password:document.getElementById('cli-pass').value.trim()};
    var errEl=document.getElementById('login-error');errEl.classList.add('hidden');
    try{
      var res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      var text=await res.text();var data;
      try{data=JSON.parse(text);}catch(e){errEl.textContent='Error inesperado';errEl.classList.remove('hidden');return;}
      if(!res.ok){errEl.textContent=data.error||'Credenciales incorrectas';errEl.classList.remove('hidden');return;}
      S.token=data.token;S.user=data.user;
      localStorage.setItem('s_token',S.token);localStorage.setItem('s_user',JSON.stringify(S.user));
      startApp();
    }catch(e){errEl.textContent='Error de conexión';errEl.classList.remove('hidden');}
  }

  function logout(){
    fetch('/api/auth/logout',{method:'POST',headers:{'Authorization':'Bearer '+S.token}}).catch(function(){});
    S.token=null;S.user=null;
    localStorage.removeItem('s_token');localStorage.removeItem('s_user');
    // Ocultar todo
    ['topbar-admin','topbar-cliente','hero-section'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){el.classList.add('hidden');el.style.display='none';}
    });
    var appEl=document.getElementById('app');
    appEl.classList.add('hidden');appEl.style.display='none';
    var lsEl=document.getElementById('login-screen');
    lsEl.classList.remove('hidden');lsEl.style.display='';
    if(window._nt)clearInterval(window._nt);
  }

  function startApp(){
    // Ocultar splash
    var loadEl=document.getElementById('loading');
    if(loadEl){loadEl.style.opacity='0';setTimeout(function(){loadEl.remove();},300);}

    // Ocultar login, mostrar app
    var lsEl=document.getElementById('login-screen');
    lsEl.classList.add('hidden');lsEl.style.display='none';
    var appEl=document.getElementById('app');
    appEl.classList.remove('hidden');appEl.style.display='flex';

    var initials=(S.user&&S.user.nombre||'U').split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();

    // Ocultar AMBOS topbars primero
    var allTops=['topbar-admin','topbar-cliente','hero-section'];
    allTops.forEach(function(id){
      var el=document.getElementById(id);
      if(el){el.classList.add('hidden');el.style.display='none';}
    });

    if(isAdmin()){
      // ── PORTAL ADMIN ──
      var ta=document.getElementById('topbar-admin');
      ta.classList.remove('hidden');ta.style.display='';
      var badge=document.getElementById('user-badge-admin');
      if(badge)badge.textContent=initials;
      buildNav(ADMIN_NAV);
      setPage('dashboard');
    } else {
      // ── PORTAL CLIENTE ──
      var tc=document.getElementById('topbar-cliente');
      tc.classList.remove('hidden');tc.style.display='';
      var badge2=document.getElementById('user-badge');
      if(badge2)badge2.textContent=initials;
      var grname=document.getElementById('gr-name');
      if(grname){
        var n=S.user&&S.user.nombre||'';
        grname.textContent=n.split(' ')[0]||n;
      }
      buildNav(CLIENT_NAV);
      setPage('mis-ordenes');
      if('Notification' in window)Notification.requestPermission();
      if(window._nt)clearInterval(window._nt);
      window._nt=setInterval(checkNotifs,45000);
      setTimeout(checkNotifs,3000);
    }
    // Desregistrar SW viejo para evitar cache
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(function(regs){
        regs.forEach(function(r){r.unregister();});
      });
    }
  }

  async function checkNotifs(){
    if(!S.token||!S.user||isAdmin())return;
    try{
      var n=await apiFetch('/api/portal/notificaciones');
      if(!n||!n.length)return;
      var nv=n.filter(function(x){return x.nueva;});
      if(nv.length&&Notification.permission==='granted')
        nv.forEach(function(x){new Notification(x.titulo,{body:x.desc,icon:'/assets/logo_sandoval.jpg'});});
      if(nv.length)await apiFetch('/api/portal/notificaciones/marcar-leidas',{method:'POST',body:JSON.stringify({ids:nv.map(function(x){return x.id;})})});
    }catch(e){}
  }
  </script>

  <script>
  // ── RENDER ORDEN CARD ─────────────────────────────────────────────
  function renderOrdenCard(o){
    var si=getStatus(o.estado);
    var idx=phaseIdx(o.estado);
    var pct=Math.round((idx/Math.max(PHASES.length-1,1))*100);
    var total=itemsTotal(o);
    var aprobPending=(o.estado||'').toUpperCase().includes('APROB');
    var steps=PHASES.map(function(p,i){
      var done=i<idx,active=i===idx;
      var dot=done?'<div class="sd"><svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg></div>':
               active?'<div class="sa"><div class="sa-dot"></div></div>':
               '<div class="sp"></div>';
      var line=i<PHASES.length-1?'<div class="sl'+(i<idx?' done':'')+'"></div>':'';
      return dot+line;
    }).join('');
    var aprob=aprobPending?'<div style="background:var(--amber-light);border-radius:10px;padding:10px 12px;margin-top:10px;display:flex;align-items:center;gap:8px"><span class="material-icons-round" style="font-size:16px;color:#b36200">warning</span><span style="font-size:12px;color:#b36200;font-weight:500">Requiere tu aprobación</span></div>':'';
    return'<div class="oc slide-up" onclick="showOrdenDetalle('+JSON.stringify(o).replace(/"/g,'&quot;')+')">'
      +'<div class="oc-top">'
        +'<div><div class="oc-plate">'+(o.vehiculo_placa||'—')+'</div><div class="oc-id">'+o.consecutivo+' · '+fmtDate(o.fecha)+'</div></div>'
        +'<span class="badge" style="background:'+si.bg+';color:'+si.fg+'">'+si.lbl+'</span>'
      +'</div>'
      +'<div class="oc-title">'+(o.motivo||'Revisión').slice(0,44)+'</div>'
      +'<div class="oc-steps">'+steps+'</div>'
      +'<div class="oc-foot">'
        +'<span class="oc-phase">'+PHASES[Math.min(idx,PHASES.length-1)].label+'</span>'
        +(total>0?'<span class="oc-amt">'+fmtMoney(total)+'</span>':'<span class="oc-pct">'+pct+'%</span>')
      +'</div>'
      +aprob
      +'</div>';
  }

  // ── PÁGINAS CLIENTE ───────────────────────────────────────────────
  async function pageMisOrdenes(){
    var c=document.getElementById('content');
    c.innerHTML='<div style="text-align:center;padding:50px;color:var(--text3)">Cargando...</div>';
    var data=await apiFetch('/api/cliente/mis-ordenes');
    if(!data)return;
    buildHero(data);
    if(!data.length){
      c.innerHTML='<div class="sec"><div class="empty"><div class="empty-icon">🔧</div><div class="empty-title">Sin órdenes registradas</div><div class="empty-sub">Aquí aparecerán tus órdenes de servicio</div></div></div>';
      return;
    }
    var activas=data.filter(function(o){var e=(o.estado||'').toUpperCase();return!['ARCHIVADO','ENTREGADO','ENTREGA'].includes(e);}).length;
    var completadas=data.filter(function(o){var e=(o.estado||'').toUpperCase();return['ARCHIVADO','ENTREGADO','ENTREGA'].includes(e);}).length;
    var invertido=data.reduce(function(s,o){return s+itemsTotal(o);},0);
    var html='<div class="slide-up">'
      +'<div class="stats">'
        +'<div class="stat"><div class="stat-n blue">'+activas+'</div><div class="stat-l">Activas</div></div>'
        +'<div class="stat"><div class="stat-n green">'+completadas+'</div><div class="stat-l">Listas</div></div>'
        +'<div class="stat"><div class="stat-n amber">'+fmtMoney(invertido)+'</div><div class="stat-l">Invertido</div></div>'
      +'</div>'
      +'<div class="sec"><div class="sec-head"><span class="sec-title">Mis órdenes</span></div>'
      +data.map(function(o){return renderOrdenCard(o);}).join('')
      +'</div></div>';
    c.innerHTML=html;
  }

  async function pageMiFlota(){
    var c=document.getElementById('content');
    c.innerHTML='<div style="text-align:center;padding:50px;color:var(--text3)">Cargando...</div>';
    var data=await apiFetch('/api/cliente/mis-ordenes');
    if(!data)return;
    var flotas={};
    data.forEach(function(o){
      var p=o.vehiculo_placa||'—';
      if(!flotas[p])flotas[p]={placa:p,marca:o.vehiculo_marca||'',modelo:o.vehiculo_modelo||'',ordenes:[]};
      flotas[p].ordenes.push(o);
    });

      var o=v.ordenes.find(function(x){return!['ARCHIVADO','ENTREGADO'].includes((x.estado||'').toUpperCase());})||v.ordenes[0];
      var si=o?getStatus(o.estado):{bg:'#f2f2f7',fg:'#636366',bar:'#aeaeb2',lbl:'Sin orden'};
      var idx=o?phaseIdx(o.estado):0;
      var pct=Math.round((idx/Math.max(PHASES.length-1,1))*100);
      var modelo=[v.marca,v.modelo].filter(Boolean).join(' ')||'Vehículo';
      var onclick=o?'onclick="showOrdenDetalle('+JSON.stringify(o).replace(/"/g,'&quot;')+')"':'';
      html+='<div class="fc slide-up" '+onclick+'>'
        +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">'

          +'<span class="badge" style="background:'+si.bg+';color:'+si.fg+'">'+si.lbl+'</span>'
        +'</div>'
        +'<div class="fc-bar"><div class="fc-fill" style="width:'+pct+'%;background:'+si.bar+'"></div></div>'
        +'<div class="fc-foot"><span>'+v.ordenes.length+' orden'+(v.ordenes.length!==1?'es':'')+'</span><span>'+PHASES[Math.min(idx,PHASES.length-1)].label+'</span></div>'
        +'</div>';
    });
    html+='</div></div>';
    c.innerHTML=html;
  }

  async function pageHistorial(){

  }

    var items=[];

    var total=items.reduce(function(s,it){return s+parseFloat(it.total||0);},0);

    // Agrupar evidencias por fase
    var evByFase={};

      var raw=o.fotos_evidencia;
      if(typeof raw==='string'&&raw.trim().startsWith('['))raw=JSON.parse(raw);

        if(path){if(!evByFase[fase])evByFase[fase]=[];evByFase[fase].push({path:path,tipo:tipo});}

    }catch(e){}

    // Stepper horizontal
    var stepperItems=PHASES.map(function(p,i){
      var done=i<idx,active=i===idx;

               active?'<div class="sta"><div style="width:8px;height:8px;background:#fff;border-radius:50%"></div></div>':

    }).join('');

    // Construir fases acordeón
    var phasesHTML=PHASES.map(function(p,i){
      var done=i<idx,active=i===idx,pend=i>idx;
      if(pend)return buildFasePend(p,i+1);
      if(done)return buildFaseDone(p,o,items,total,evByFase,i,idx);
      return buildFaseActive(p,o,items,total,evByFase,i);
    }).join('');

    var html='<div class="ms-handle"></div>'
      +'<div class="dh">'
        +'<div class="dh-id">'+o.consecutivo+'</div>'
        +'<div class="dh-title">'+(o.motivo||'Orden de servicio')+'</div>'
        +'<div class="dh-chips">'
          +'<div class="dh-chip">'+o.vehiculo_placa+'</div>'
          +(o.tecnico?'<div class="dh-chip">Tec: '+o.tecnico+'</div>':'')
          +(o.km?'<div class="dh-chip">KM '+o.km+'</div>':'')
          +'<div class="dh-chip">'+fmtDate(o.fecha)+'</div>'
        +'</div>'
        +'<div class="dh-prog">'
          +'<div class="dh-prog-top"><span class="dh-prog-lbl">Progreso · <span style="color:var(--blue)">'+si.lbl+'</span></span><span class="dh-prog-pct">'+pct+'%</span></div>'
          +'<div class="prog-track"><div class="prog-fill" style="width:'+pct+'%"></div></div>'
        +'</div>'
      +'</div>'
      // stepper
      +'<div class="stepper-card">'
        +'<div class="st-row">'+stepperItems+'</div>'
        +'<div class="st-labels">'+stepLabels+'</div>'
      +'</div>'
      // fases
      +'<div class="phases-wrap" style="margin-top:10px">'+phasesHTML+'</div>'
      // WA
      +'<div style="padding:0 14px 8px">'        // Boton Gestionar Orden (solo para admin)
        +(S.user&&S.user.rol!=='cliente'?          '<button onclick="closeSheet();abrirGestionOrden(\''+o.consecutivo+'\')" style="width:100%;padding:14px;background:#1d4ed8;border:none;border-radius:14px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px">'            +'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>'            +'Gestionar fases de la orden'          +'</button>' : '')        +'<button onclick="window.open(\'https://wa.me/51924980586\')" class="wa-btn">'          +'<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.138.564 4.144 1.546 5.879L.057 23.885a.5.5 0 00.611.611l5.994-1.491A11.956 11.956 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.934 0-3.741-.518-5.296-1.419l-.374-.22-3.879.965.982-3.793-.242-.385A9.943 9.943 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>'
          +'Consultar por WhatsApp'
        +'</button>'
      +'</div>';

    openSheet(html);
  }

  function buildFasePend(p,num){
    return'<div class="phase-item" style="opacity:.4;pointer-events:none">'
      +'<div class="ph-header">'
        +'<div class="ph-dot ph-dot-wait">'+num+'</div>'
        +'<div class="ph-info"><div class="ph-name wait">'+p.label+'</div><div class="ph-time">Pendiente</div></div>'
      +'</div></div>';
  }

  function buildFaseDone(p,o,items,total,evByFase,i,idx){
    var body=buildFaseBody(p,o,items,total,evByFase,i,false);
    return'<div class="phase-item" onclick="toggleFase(this)">'
      +'<div class="ph-header">'
        +'<div class="ph-dot ph-dot-done"><svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg></div>'
        +'<div class="ph-info"><div class="ph-name">'+p.label+'</div><div class="ph-time">Completada</div></div>'
        +'<div class="ph-chevron">›</div>'
      +'</div>'
      +'<div class="ph-body">'+body+'</div>'
      +'</div>';
  }

  function buildFaseActive(p,o,items,total,evByFase,i){
    var body=buildFaseBody(p,o,items,total,evByFase,i,true);
    return'<div class="phase-item" onclick="toggleFase(this)">'
      +'<div class="ph-header">'
        +'<div class="ph-dot ph-dot-now"><div class="ph-dot-now-in"></div></div>'
        +'<div class="ph-info"><div class="ph-name now">'+p.label+'</div><div class="ph-time" style="color:var(--blue)">En proceso</div></div>'
        +'<div class="ph-chevron open" style="color:var(--blue)">›</div>'
      +'</div>'
      +'<div class="ph-body open">'+body+'</div>'
      +'</div>';
  }
  </script>

  <script>
  function buildFaseBody(p,o,items,total,evByFase,phaseIndex,isActive){
    var html='';
    var pid=p.id;
    var cl=o.checklist_reparacion||{};
    if(typeof cl==='string'){try{cl=JSON.parse(cl);}catch(e){cl={};}}
    var dd=cl.diagnostic_details||{};
    var findings=o.findings||cl.findings||[];
    var qc=o.quick_check||cl.quick_check||{};
    if(typeof qc==='string'){try{qc=JSON.parse(qc);}catch(e){qc={};}}
    var qualityControl=o.quality_control||cl.quality_control||{};
    if(typeof qualityControl==='string'){try{qualityControl=JSON.parse(qualityControl);}catch(e){qualityControl={};}}

    // RECEPCION
    if(pid==='RECEPCION'){
      var motivo=o.motivo||o.descripcion||'';
      var obs=o.observaciones||''; var km=o.km||'';
      if(motivo) html+='<div style="background:#f0f5ff;border-radius:12px;padding:12px 14px;margin-bottom:10px"><div style="font-size:9px;font-weight:700;color:#4f46e5;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px">Motivo de ingreso</div><div style="font-size:13px;color:#1e1b4b;line-height:1.6">'+motivo+'</div></div>';
      var chips='';
      if(km) chips+='<span style="background:#f2f2f7;border-radius:8px;padding:5px 11px;font-size:12px;color:#636366"><b>KM:</b> '+km+'</span> ';
      if(obs) chips+='<span style="background:#f2f2f7;border-radius:8px;padding:5px 11px;font-size:12px;color:#636366">'+obs+'</span>';
      if(chips) html+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">'+chips+'</div>';
    }

    // DIAGNOSTICO
    if(pid==='DIAGNOSTICO'){
      var scanPath=o.scanner_path||dd.scanner_path||'';
      if(scanPath){
        var scanUrl=scanPath.startsWith('/')||scanPath.startsWith('http')?scanPath:'/'+scanPath;
        html+='<div onclick="window.open(\''+scanUrl+'\',\'_blank\')" style="background:#f0f9ff;border:1.5px solid #bae6fd;border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px;cursor:pointer"><div style="width:36px;height:36px;background:#0ea5e9;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><div><div style="font-size:13px;font-weight:600;color:#0c4a6e">Reporte de Escaner (PDF)</div><div style="font-size:11px;color:#0369a1">Toca para ver</div></div></div>';
      }
      var sistema=Array.isArray(dd.system)?dd.system.join(', '):(dd.system||'');
      var codigos=dd.codes||'';
      if(sistema||codigos){
        html+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">';
        if(sistema) html+='<span style="background:#e8f4ff;color:#007aff;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:600">'+sistema+'</span>';
        if(codigos) html+='<span style="background:#fff0f0;color:#cc0000;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:600">Cod: '+codigos+'</span>';
        html+='</div>';
      }
      var tests=dd.tests||''; var analysis=dd.analysis||''; var solution=dd.solution||'';
      if(!tests&&!analysis&&!solution&&o.diagnostico){
        var diag=o.diagnostico; var lineas=diag.split('\n'); var seccion='';
        for(var li=0;li<lineas.length;li++){
          var ln=lineas[li];
          if(/PRUEBAS/i.test(ln)){seccion='p';continue;}
          if(/HALLAZGOS|ANALISIS/i.test(ln)){seccion='h';continue;}
          if(/SOLUCI/i.test(ln)){seccion='s';continue;}
          if(seccion==='p') tests+=(tests?'\n':'')+ln;
          else if(seccion==='h') analysis+=(analysis?'\n':'')+ln;
          else if(seccion==='s') solution+=(solution?'\n':'')+ln;
        }
        if(!tests&&!analysis&&!solution) analysis=o.diagnostico;
      }
      if(tests) html+='<div style="background:#f5f3ff;border-radius:12px;padding:12px 14px;margin-bottom:8px"><div style="font-size:9px;font-weight:700;color:#7c3aed;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px">Pruebas realizadas</div><div style="font-size:13px;color:#3b2b6b;line-height:1.6;white-space:pre-wrap;word-break:break-word;overflow:visible">'+tests.trim()+'</div></div>';
      if(analysis) html+='<div style="background:#fff6e5;border-radius:12px;padding:12px 14px;margin-bottom:8px"><div style="font-size:9px;font-weight:700;color:#d97706;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px">Hallazgos / Analisis</div><div style="font-size:13px;color:#78350f;line-height:1.6;white-space:pre-wrap;word-break:break-word;overflow:visible">'+analysis.trim()+'</div></div>';
      if(solution) html+='<div style="background:#ecfdf5;border-radius:12px;padding:12px 14px;margin-bottom:8px"><div style="font-size:9px;font-weight:700;color:#059669;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px">Solucion / Procedimiento</div><div style="font-size:13px;color:#064e3b;line-height:1.6;white-space:pre-line">'+solution.trim()+'</div></div>';
      if(Array.isArray(findings)&&findings.length){
        html+='<div style="background:#f8fafc;border-radius:12px;padding:12px 14px;margin-bottom:8px"><div style="font-size:9px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">Hallazgos detectados</div>';
        findings.forEach(function(f){
          var nombre=f.nombre||f.name||f.descripcion||String(f);
          var tipo=f.tipo||f.type||''; var color=tipo==='CRITICO'?'#dc2626':tipo==='IMPORTANTE'?'#d97706':'#059669';
          html+='<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid #f1f5f9"><div style="width:8px;height:8px;border-radius:50%;background:'+color+';flex-shrink:0"></div><span style="font-size:12px;color:#1e293b;flex:1">'+nombre+'</span>'+(tipo?'<span style="font-size:10px;color:'+color+';font-weight:600">'+tipo+'</span>':'')+'</div>';
        });
        html+='</div>';
      }
      if(qc&&Object.keys(qc).length){
        html+='<div style="background:#f8fafc;border-radius:12px;padding:12px 14px;margin-bottom:8px"><div style="font-size:9px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">Inspeccion visual</div>';
        Object.keys(qc).forEach(function(k){
          var v=qc[k]; var status=typeof v==='object'?(v.status||v.estado||''):String(v); var note=typeof v==='object'?(v.note||v.nota||''):'';
          var isOk=status==='OK'||status==='ok';
          html+='<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:0.5px solid #f1f5f9"><span style="font-size:12px;color:#1e293b;flex:1">'+k+'</span><span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;background:'+(isOk?'#dcfce7':'#fee2e2')+';color:'+(isOk?'#166534':'#991b1b')+'">'+status+'</span>'+(note?'<span style="font-size:10px;color:#64748b;margin-left:4px">'+note+'</span>':'')+'</div>';
        });
        html+='</div>';
      }
    }

    // PRESUPUESTO - usa precio_unitario
    if(pid==='REPUESTOS'){
      if(items&&items.length){
        html+='<div style="background:#f8fafc;border-radius:12px;padding:0 14px;margin-bottom:8px">';
        items.forEach(function(it){
          var nombre=it.nombre||it.item||it.descripcion||'-';
          var qty=parseFloat(it.cantidad||1);
          var precio=parseFloat(it.precio_unitario||it.precio||0);
          var tot=parseFloat(it.total||precio*qty||0);
          var cat=it.categoria||it.tipo||'';
          html+='<div style="padding:10px 0;border-bottom:0.5px solid #f1f5f9"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="flex:1;min-width:0"><div style="font-size:13px;color:#1e293b;font-weight:500">'+nombre+'</div>'+(cat?'<div style="font-size:10px;color:#94a3b8;margin-top:2px">'+cat+'</div>':'')+'</div><div style="text-align:right;flex-shrink:0;margin-left:10px"><div style="font-size:13px;font-weight:600;color:#1e293b">'+fmtMoney(tot)+'</div>'+(qty>1?'<div style="font-size:10px;color:#94a3b8">x'+qty+' . '+fmtMoney(precio)+'</div>':'')+'</div></div></div>';
        });
        html+='</div><div style="background:var(--blue);border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:14px;font-weight:600;color:#fff">Total presupuesto</span><span style="font-size:18px;font-weight:700;color:#fff">'+fmtMoney(total)+'</span></div>';
      } else {
        html+='<div style="font-size:13px;color:var(--text3)">Sin items registrados aun.</div>';
      }
    }

    // APROBACION
    if(pid==='APROBACION'){
      if(phaseIndex>3){
        html+='<div style="background:#dcfce7;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg><span style="font-size:13px;color:#166534;font-weight:500">Trabajos aprobados por el cliente</span></div>';
      } else if(isActive){
        var cons=String(o.consecutivo||'');
        html+='<div style="background:#fff6e5;border-radius:12px;padding:14px;margin-bottom:10px"><div style="font-size:13px;font-weight:600;color:#b36200;margin-bottom:4px">Presupuesto pendiente de aprobacion</div><div style="font-size:12px;color:#8a5000;margin-bottom:12px">Revisa los items y autoriza para iniciar la reparacion.</div>';
        if(items&&items.length){
          html+='<div style="background:#fff;border-radius:10px;padding:0 12px;margin-bottom:12px">';
          items.forEach(function(it){
            html+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid #f1f5f9;font-size:12px"><span style="color:#1e293b">'+(it.nombre||it.item||'-')+'</span><span style="font-weight:600">'+fmtMoney(parseFloat(it.total||0))+'</span></div>';
          });
          html+='<div style="display:flex;justify-content:space-between;padding:10px 0;font-size:14px;font-weight:700"><span>Total</span><span style="color:var(--blue)">'+fmtMoney(total)+'</span></div></div>';
        }
        html+='<button onclick="aprobarOrden(\''+cons+'\',true)" style="width:100%;padding:13px;background:var(--blue);border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px">Aprobar y autorizar trabajos</button><button onclick="aprobarOrden(\''+cons+'\',false)" style="width:100%;padding:11px;background:transparent;border:1.5px solid var(--border);border-radius:12px;color:var(--text2);font-size:13px;cursor:pointer">Posponer decision</button></div>';
      }
    }

    // CONTROL DE CALIDAD - usa quality_control del checklist
    if(pid==='CONTROL'){
      var qcItems=Object.keys(qualityControl);
      if(qcItems.length){
        var labels={
  'repair_done':'Reparacion realizada','parts_ok':'Repuestos correctos',
  'no_leaks':'Sin fugas','fluids_level':'Nivel de fluidos',
  'engine_start':'Arranque del motor','test_drive':'Prueba de manejo',
  'brakes_ok':'Frenos OK','brakes_test':'Prueba de frenos',
  'lights_ok':'Luces OK','Luces OK':'Luces OK',
  'bodywork_ok':'Carroceria OK','interior_ok':'Interior OK',
  'glass_ok':'Vidrios OK','tires_ok':'Neumaticos OK',
  'tools_removed':'Herramientas retiradas','evidence_ok':'Evidencia completa',
  'order_signed':'Orden firmada','warranty_given':'Garantia entregada',
  'payment_ok':'Pago recibido','cleaning_ok':'Limpieza OK',
  'final_check':'Revision final','customer_notified':'Cliente notificado',
  'Luces':'Luces','Neumaticos':'Neumaticos','Fluidos':'Fluidos',
  'Bateria':'Bateria','Carroceria':'Carroceria','Interior':'Interior',
  'Parabrisas Delantero':'Parabrisas delantero','Parabrisas Trasero':'Parabrisas trasero'
};
        html+='<div style="background:#f0fdf4;border-radius:12px;padding:12px 14px;margin-bottom:8px"><div style="font-size:9px;font-weight:700;color:#166534;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">Resultados del control de calidad</div>';
        qcItems.forEach(function(k){
          var v=qualityControl[k];
          var status=typeof v==='object'?(v.status||v.estado||'ok'):String(v);
          var note=typeof v==='object'?(v.note||v.nota||''):'';
          var isOk=status==='ok'||status==='OK';
          var label=labels[k]||(k.replace(/_/g,' ').replace(/\b\w/g,function(l){return l.toUpperCase();}));
          html+='<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid #dcfce7"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="'+(isOk?'#16a34a':'#dc2626')+'" stroke-width="2.5" stroke-linecap="round">'+(isOk?'<polyline points="20 6 9 17 4 12"/>':'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>')+'</svg><span style="font-size:13px;color:#1e293b;flex:1">'+label+'</span><span style="font-size:11px;color:'+(isOk?'#16a34a':'#dc2626')+';font-weight:600">'+(isOk?'OK':'Revisar')+'</span>'+(note?'<span style="font-size:10px;color:#64748b">'+note+'</span>':'')+'</div>';
        });
        html+='</div>';
      } else {
        html+='<div style="font-size:13px;color:var(--text3)">Control de calidad en proceso.</div>';
      }
    }

    // ENTREGA
    if(pid==='ENTREGA'){
      var notasEntrega=o.notas_entrega||''; var proxMant=o.proximo_mantenimiento||'';
      if(notasEntrega) html+='<div style="background:#f0fdf4;border-radius:12px;padding:12px 14px;margin-bottom:8px"><div style="font-size:9px;font-weight:700;color:#166534;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px">Notas de entrega</div><div style="font-size:13px;color:#14532d;line-height:1.6">'+notasEntrega+'</div></div>';
      if(proxMant) html+='<div style="background:#fef3c7;border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg><div><div style="font-size:11px;font-weight:700;color:#92400e">Proximo mantenimiento</div><div style="font-size:13px;color:#78350f">'+proxMant+'</div></div></div>';
      if(!notasEntrega&&!proxMant&&phaseIndex>=6) html+='<div style="background:#dcfce7;border-radius:12px;padding:14px;text-align:center"><div style="font-size:24px;margin-bottom:8px">Vehiculo entregado</div><div style="font-size:14px;font-weight:600;color:#166534">Gracias por confiar en Mecanica Sandoval</div></div>';
    }

    // EVIDENCIAS (todas las fases)
    var normId=pid.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    var evs=evByFase[normId]||evByFase[pid]||[];
    if(evs.length){
      html+='<div class="ev-lbl" style="margin-top:10px">'+(isActive?'Evidencia del trabajo':'Evidencia fotografica')+'</div>';
      html+='<div class="ev-grid'+(evs.length===1?' single':'')+'">';
      evs.forEach(function(ev){
        var url=(ev.path.startsWith('/')||ev.path.startsWith('http'))?ev.path:'/'+ev.path;
        var isVid=ev.tipo==='video'||/\.(mp4|mov|webm|avi|3gp)$/i.test(ev.path);
        if(isVid){
          html+='<div class="ev-item" onclick="window.open(\''+url+'\')"><div class="ev-video-wrap"><div class="ev-play"><svg viewBox="0 0 12 14"><polygon points="1,1 11,7 1,13"/></svg></div><div class="ev-video-lbl">Ver video</div></div></div>';
        } else {
          html+='<div class="ev-item" onclick="window.open(\''+url+'\')"><img class="ev-img" src="'+url+'" loading="lazy" onerror="this.parentElement.style.background=\'#f2f2f7\';this.style.display=\'none\'"></div>';
        }
      });
      html+='</div>';
    }
    if(!html) html='<div style="font-size:13px;color:var(--text3);padding:4px 0">Fase completada.</div>';
    return html;
  }

  function toggleFase(item){
    var body=item.querySelector('.ph-body');
    var chev=item.querySelector('.ph-chevron');
    if(!body)return;
    var open=body.classList.contains('open');
    body.classList.toggle('open',!open);
    body.style.display=open?'none':'block';
    if(chev){chev.classList.toggle('open',!open);}
  }

  async function aprobarOrden(id,aprobado){
    var r=await apiFetch('/api/cliente/aprobar',{method:'POST',body:JSON.stringify({orden_id:id,aprobado:aprobado})});
    if(r&&r.ok){
      if(aprobado){toastOk('¡Trabajos autorizados!');closeSheet();setTimeout(function(){var msg='Hola, acabo de aprobar mi presupuesto desde el portal.';window.location.href='https://wa.me/51924980586?text='+encodeURIComponent(msg);},1500);}
      else{toastOk('Decisión pospuesta');closeSheet();setPage('mis-ordenes');}
    }else toastErr((r&&r.error)||'Error al procesar');
  }

  function openSheet(html){
    closeSheet();
    var overlay=document.createElement('div');
    overlay.id='sheet-overlay';overlay.className='modal-overlay';
    overlay.innerHTML='<div class="modal-sheet">'+html+'</div>';
    overlay.addEventListener('click',function(e){if(e.target===overlay)closeSheet();});
    document.body.appendChild(overlay);
    // Abrir fase activa por defecto
    var activo=overlay.querySelector('.ph-body.open');
    if(activo)activo.style.display='block';
  }
  function closeSheet(){var el=document.getElementById('sheet-overlay');if(el)el.remove();}
  </script>

        +'<div style="display:flex;gap:10px">'
          +'<div style="flex:1"><div style="font-size:10px;color:#ffffff50;margin-bottom:2px">Ingresos</div><div id="gw-ingresos" style="font-size:15px;font-weight:700;color:#60a5fa">—</div></div>'
          +'<div style="flex:1"><div style="font-size:10px;color:#ffffff50;margin-bottom:2px">Costos</div><div id="gw-costos" style="font-size:15px;font-weight:700;color:#f87171">—</div></div>'
          +'<div style="flex:1"><div style="font-size:10px;color:#ffffff50;margin-bottom:2px">Ganancia</div><div id="gw-ganancia" style="font-size:15px;font-weight:700;color:#4ade80">—</div></div>'
          +'<div style="text-align:right"><div style="font-size:10px;color:#ffffff50;margin-bottom:2px">Margen</div><div id="gw-margen" style="font-size:15px;font-weight:700;color:#fbbf24">—</div></div>'
        +'</div>'

        +'<span class="sec-link" onclick="setPage(\'ordenes\')">Ver todas</span></div>'

  async function pageClientes(){
    document.getElementById('topbar-section').textContent='Clientes';
    var c=document.getElementById('content');c.innerHTML='<div style="text-align:center;padding:50px;color:var(--text3)">Cargando...</div>';
    var data=await apiFetch('/api/clientes');if(!data)return;
    window._clientesData=data;
    function renderClientes(list){
      var rows=list.map(function(cl){
        var nombre=(cl.nombre||'')+(cl.apellidos?' '+cl.apellidos:'');
        var ini=nombre.split(' ').map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase()||'?';
        return'<div class="hr slide-up" style="align-items:center;gap:12px" onclick="verPerfilCliente(\''+encodeURIComponent(cl.id)+'\')">'
          +'<div style="width:40px;height:40px;border-radius:50%;background:#e0eaff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#1d4ed8;flex-shrink:0">'+ini+'</div>'
          +'<div style="flex:1;min-width:0">'
            +'<div style="font-size:14px;font-weight:600;color:var(--text)">'+nombre+'</div>'
            +'<div style="font-size:11px;color:var(--text3);margin-top:1px">'+(cl.telefono||cl.id||'')+'</div>'
          +'</div>'
          +'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--text3)" stroke-width="1.5"><path d="M6 3l5 5-5 5"/></svg>'
          +'</div>';
      }).join('');
      document.getElementById('clientes-list').innerHTML=rows||'<div style="text-align:center;padding:20px;color:var(--text3);font-size:13px">Sin resultados</div>';
      document.getElementById('clientes-count').textContent='Clientes ('+list.length+')';
    }
    c.innerHTML='<div class="slide-up"><div class="sec">'
      +'<div class="sec-head"><span id="clientes-count" class="sec-title">Clientes ('+data.length+')</span></div>'
      +'<div style="padding:0 0 10px">'
        +'<input id="cli-search" type="search" placeholder="Buscar por nombre, teléfono o DNI/RUC..." oninput="filtrarClientes(this.value)" style="border-radius:12px;border:1.5px solid var(--border);font-size:14px;padding:11px 14px;background:#fff;width:100%">'
      +'</div>'
      +'<div id="clientes-list" style="background:#fff;border-radius:20px;padding:0 16px"></div>'
      +'</div></div>';
    renderClientes(data);
    window._renderClientes=renderClientes;
  }
  function filtrarClientes(q){
    var list=window._clientesData||[];
    q=(q||'').toLowerCase().trim();
    if(!q){window._renderClientes(list);return;}
    window._renderClientes(list.filter(function(cl){
      var nombre=((cl.nombre||'')+' '+(cl.apellidos||'')).toLowerCase();
      return nombre.includes(q)||(cl.telefono||'').includes(q)||(cl.id||'').toLowerCase().includes(q);
    }));
  }

    var ini=nombre.split(' ').map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase()||'?';
    var html='<div class="slide-up">';
    // Header cliente
    html+='<div style="background:#fff;border-radius:20px;padding:18px 16px;margin-bottom:12px">'

        +'<div style="width:52px;height:52px;border-radius:50%;background:#e0eaff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#1d4ed8;flex-shrink:0">'+ini+'</div>'
        +'<div style="flex:1">'
          +'<div style="font-size:17px;font-weight:700;color:var(--text)">'+nombre+'</div>'
          +'<div style="font-size:12px;color:var(--text3);margin-top:2px">'+data.id+'</div>'
        +'</div>'
      +'</div>'

  function filtrarInventario(q){
    var list=window._invData||[];

    if(!q){window._renderInv(list);return;}
    window._renderInv(list.filter(function(i){
      return (i.nombre||'').toLowerCase().includes(q)||(i.categoria||'').toLowerCase().includes(q);

  async function cargarVehiculos(clienteId){

    var vehs=await apiFetch('/api/clientes/'+encodeURIComponent(clienteId)+'/vehiculos');
    var sel=document.getElementById('no-vehiculo');

  async function guardarNuevoCliente(){
    var id=(document.getElementById('nc-id').value||'').trim();
    var nombre=(document.getElementById('nc-nombre').value||'').trim();
    if(!id||!nombre){toastErr('DNI/RUC y Nombre son obligatorios');return;}
    var r=await apiFetch('/api/clientes/nuevo',{method:'POST',body:JSON.stringify({
      id:id,nombre:nombre,
      apellidos:(document.getElementById('nc-apellidos').value||'').trim(),
      telefono:(document.getElementById('nc-telefono').value||'').trim(),
      email:(document.getElementById('nc-email').value||'').trim()
    })});
    if(r&&r.ok){
      toastOk('Cliente creado');
      closeSheet();
      var clientes=await apiFetch('/api/clientes');
      if(!clientes)return;
      window._noClientes=clientes;
      var sel=document.getElementById('no-cliente');
      sel.innerHTML='<option value="">Seleccionar cliente...</option>'
        +clientes.map(function(cl){return'<option value="'+cl.id+'"'+(cl.id===id?' selected':'')+'>'+( cl.nombre||'')+(cl.apellidos?' '+cl.apellidos:'')+'</option>';}).join('');
      cargarVehiculos(id);
    } else {
      toastErr((r&&r.error)||'Error al guardar cliente');
    }
  }

  async function crearOrden(){

    var motivo=document.getElementById('no-motivo').value.trim();
    var km=document.getElementById('no-km').value;

  function calcTotal(o){
    var items=o.items_cotizacion||o.items||[];
    if(typeof items==='string')try{items=JSON.parse(items);}catch(e){items=[];}
    return items.reduce(function(s,it){return s+parseFloat(it.total||0);},0);
  }

  async function cambiarEstadoOrden(consecutivo,nuevoIdx){
    var fase=PHASES[nuevoIdx];
    var ESTADO_MAP={
      'RECEPCION':'RECEPCIÓN','DIAGNOSTICO':'DIAGNÓSTICO',
      'REPUESTOS':'REPUESTOS','COTIZACION':'COTIZACIÓN',
      'APROBACION':'APROBACIÓN','REPARACION':'REPARACIÓN',
      'CONTROL':'CONTROL CALIDAD','ENTREGA':'ARCHIVADO'
    };
    var estado=ESTADO_MAP[fase.id]||fase.id;
    // Si va a ARCHIVADO, mostrar modal de factura primero
    if(fase.id==='ENTREGA'){
      mostrarModalFactura(consecutivo);
      return;
    }
    var r=await apiFetch('/api/ordenes/'+encodeURIComponent(consecutivo)+'/estado',{method:'PUT',body:JSON.stringify({estado:estado})});
    if(r&&r.ok){
      if(window._ordenActual && window._ordenActual.consecutivo===consecutivo){
        window._ordenActual.estado=estado;
        window._ordenActual=null;
      }
      toastOk('Estado: '+estado);
      abrirGestionOrden(consecutivo);
    }
    else toastErr((r&&r.error)||'Error al cambiar estado');
  }

  async function subirFacturaYArchivar(input, consecutivo){
    var file=input.files[0];
    if(!file) return;
    var m=document.getElementById('modal-factura');
    if(m) m.querySelector('button').textContent='Subiendo...';
    var fd=new FormData();
    fd.append('file',file);
    try{
      var r=await fetch('/api/ordenes/'+encodeURIComponent(consecutivo)+'/factura',{
        method:'POST',headers:{'Authorization':'Bearer '+S.token},body:fd
      });
      var data=await r.json();
      if(data.ok||data.url){
        if(m) m.remove();
        await _archivarOrden(consecutivo);
        toastOk('✅ Factura subida y orden completada');
      } else {
        toastErr('Error al subir factura');
        if(m) m.remove();
      }
    }catch(e){
      toastErr('Error de conexión');
      if(m) m.remove();
    }
  }

  async function archivarSinFactura(consecutivo){
    var m=document.getElementById('modal-factura');
    if(m) m.remove();
    await _archivarOrden(consecutivo);
    toastOk('✅ Orden completada y archivada');
  }

  async function _archivarOrden(consecutivo){
    var r=await apiFetch('/api/ordenes/'+encodeURIComponent(consecutivo)+'/estado',{
      method:'PUT',body:JSON.stringify({estado:'ARCHIVADO'})
    });
    if(r&&r.ok){
      window._ordenActual=null;
      abrirGestionOrden(consecutivo);
    } else toastErr((r&&r.error)||'Error al archivar');
  }

  // Filtrar lista de inventario en tiempo real
  function filtrarInv(q){
    var sel=document.getElementById('sel-inv');if(!sel)return;
    var opts=sel.querySelectorAll('option');
    var qn=(q||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    opts.forEach(function(opt){
      if(!opt.value){opt.style.display='';return;}
      var txt=opt.textContent.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      opt.style.display=txt.includes(qn)?'':'none';
    });
  }


  function showModalTab(tab){
    ['inv','mo','man'].forEach(function(t){
      var panel=document.getElementById('panel-'+t);
      var btn=document.getElementById('tab-'+t);
      if(panel) panel.style.display = t===tab?'block':'none';
      if(btn){
        btn.style.background = t===tab?'#1d4ed8':'#f1f5f9';
        btn.style.color = t===tab?'#fff':'#6b7280';
      }
    });
  }

  async function confirmarAgregarItem(){
    var o=window._ordenActual;
    if(!o) return;
    var items=JSON.parse(JSON.stringify(o.items_cotizacion||[]));
    var panelActivo='inv';
    ['inv','mo','man'].forEach(function(t){
      var p=document.getElementById('panel-'+t);
      if(p&&p.style.display!=='none') panelActivo=t;
    });
    var nuevo={};
    if(panelActivo==='inv'){
      var selVal=document.getElementById('sel-inv').value;
      if(!selVal){toastErr('Selecciona un item del inventario');return;}
      try{nuevo=JSON.parse(decodeURIComponent(selVal));}catch(e){toastErr('Error');return;}
      var cant=parseFloat(document.getElementById('mi-cant').value||1);
      var precio=parseFloat(document.getElementById('mi-precio').value||0);
      nuevo.cantidad=cant;
      nuevo.precio_unitario=precio;
      nuevo.total=cant*precio;
    } else if(panelActivo==='nuevo'){
      var nomN=document.getElementById('nuevo-nombre').value.trim();
      if(!nomN){toastErr('Ingresa el nombre del repuesto');return;}
      var catN=document.getElementById('nuevo-cat').value.trim()||'Repuesto';
      var precioN=parseFloat(document.getElementById('nuevo-precio').value||0);
      var stockN=parseInt(document.getElementById('nuevo-stock').value||1);
      var cantN=parseFloat(document.getElementById('nuevo-cant').value||1);
      var unidadN=document.getElementById('nuevo-unidad').value.trim()||'und';
      // Crear en inventario
      var btn=document.querySelector('#modal-item button[onclick*="confirmar"]');
      if(btn){btn.disabled=true;btn.textContent='Creando...';}
      var r=await apiFetch('/api/inventario/nuevo',{method:'POST',body:JSON.stringify({nombre:nomN,categoria:catN,precio:precioN,stock:stockN,stock_minimo:1,unidad:unidadN})});
      if(btn){btn.disabled=false;btn.textContent='✓ Agregar';}
      if(!r||!r.ok){toastErr((r&&r.error)||'Error al crear repuesto');return;}
      nuevo={nombre:nomN,categoria:catN,cantidad:cantN,precio_unitario:precioN,total:cantN*precioN};
    } else if(panelActivo==='mo'){
      var desc=(document.getElementById('mo-desc').value||'').trim();
      if(!desc){toastErr('Describe el trabajo realizado');return;}
      var pmo=parseFloat(document.getElementById('mo-precio').value||0);
      nuevo={nombre:'Mano de obra — '+desc,categoria:'Mano de obra',cantidad:1,precio_unitario:pmo,total:pmo};
    } else {
      var nom=document.getElementById('man-nombre').value.trim();
      if(!nom){toastErr('Ingresa el nombre del item');return;}
      var cat=document.getElementById('man-cat').value.trim()||'General';
      var cantM=parseFloat(document.getElementById('man-cant').value||1);
      var precioM=parseFloat(document.getElementById('man-precio').value||0);
      nuevo={nombre:nom,categoria:cat,cantidad:cantM,precio_unitario:precioM,total:cantM*precioM};
    }
    items.push(nuevo);
    o.items_cotizacion=items;
    window._itemsBuffer=items;
    document.getElementById('fe-items-list').innerHTML=items.map(buildItemRow).join('');
    calcularTotalItems();
    document.getElementById('modal-item').remove();
    toastOk('Item agregado');
  }

  function eliminarItem(idx){
    var o=window._ordenActual;
    if(!o) return;
    var items=JSON.parse(JSON.stringify(o.items_cotizacion||[]));
    items.splice(idx,1);
    o.items_cotizacion=items;
    window._itemsBuffer=items;
    document.getElementById('fe-items-list').innerHTML=items.map(buildItemRow).join('');
    calcularTotalItems();
  }

  function actualizarItem(idx,campo,valor){
    var o=window._ordenActual;
    if(!o||!o.items_cotizacion[idx]) return;
    var it=o.items_cotizacion[idx];
    it[campo]=campo==='cantidad'||campo==='precio_unitario'?parseFloat(valor)||0:valor;
    it.total=parseFloat(it.cantidad||1)*parseFloat(it.precio_unitario||0);
    var rowTot=document.getElementById('row-total-'+idx);
    if(rowTot) rowTot.textContent='S/'+it.total.toFixed(2);
    calcularTotalItems();
  }

  function calcularTotalItems(){
    var o=window._ordenActual;
    var items=o?o.items_cotizacion||[]:[];
    var total=items.reduce(function(s,it){return s+parseFloat(it.total||0);},0);
    var el=document.getElementById('fe-total-val');
    if(el) el.textContent=fmtMoney(total);
  }



  function fmtMoneyStatic(n){
    n=parseFloat(n)||0;
    return 'S/ '+n.toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
  }
