      var notasEnt=o.notas_entrega||''; var proxMant=o.proximo_mantenimiento||'';
      html+='<div class="form-card">'
        +'<div style="font-size:11px;font-weight:700;color:#166534;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px">🏁 Entrega del vehículo</div>'
        +'<div class="field"><label>Notas de entrega</label><textarea id="fe-notas-entrega" rows="3" spellcheck="false" autocorrect="off" autocomplete="off" placeholder="Instrucciones, garantía, recomendaciones al cliente...">'+notasEnt+'</textarea></div>'
        +'<div class="field"><label>Próximo mantenimiento</label><input id="fe-prox-mant" value="'+proxMant+'" placeholder="Ej: 3000 km o 3 meses"></div>'
        +'<button onclick="guardarEntrega(\''+consecutivo+'\')" class="btn-primary">💾 Guardar entrega</button>'
      +'</div>';
      html+=buildUploadZone(consecutivo,'ENTREGA');
      html+=buildGaleriaFase(o,'ENTREGA');
    }

    else {
      html+='<div class="form-card"><div style="font-size:13px;color:var(--text3);text-align:center;padding:20px">Fase no disponible</div></div>';
    }

    html+='<div style="height:30px"></div></div>';
    c.innerHTML=html;
  }

  // ── HELPERS DE EVIDENCIAS ─────────────────────────────────────────────
  function buildUploadZone(consecutivo, faseId){
    var safeCons = consecutivo.replace(/[^a-zA-Z0-9]/g,'');
    var safeFase = faseId.replace(/[^a-zA-Z0-9]/g,'');
    // Tres inputs separados: foto (capture=environment), video (capture=camcorder), galería (sin capture)
    var idFoto  = 'inp_foto_'+safeFase+'_'+safeCons;
    var idVideo = 'inp_vid_'+safeFase+'_'+safeCons;
    var idGal   = 'inp_gal_'+safeFase+'_'+safeCons;
    return '<div style="background:#fff;border-radius:14px;border:0.5px solid #eaeff5;padding:14px;margin-top:10px">'
      +'<div style="font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">📷 Agregar evidencias</div>'
      // Input foto — capture=environment abre cámara en modo FOTO
      +'<input id="'+idFoto+'" type="file" accept="image/*" capture="environment" '
        +'style="position:fixed;width:1px;height:1px;top:-999px;left:-999px;opacity:0" '
        +'onchange="subirEvidencias(\''+consecutivo+'\',\''+faseId+'\',this)">'
      // Input video — capture=camcorder abre cámara en modo VIDEO
      +'<input id="'+idVideo+'" type="file" accept="video/*" capture="camcorder" '
        +'style="position:fixed;width:1px;height:1px;top:-999px;left:-999px;opacity:0" '
        +'onchange="subirEvidencias(\''+consecutivo+'\',\''+faseId+'\',this)">'
      // Input galería — sin capture, abre explorador de archivos
      +'<input id="'+idGal+'" type="file" accept="image/*,video/*" multiple '
        +'style="position:fixed;width:1px;height:1px;top:-999px;left:-999px;opacity:0" '
        +'onchange="subirEvidencias(\''+consecutivo+'\',\''+faseId+'\',this)">'
      +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">'
        // Botón FOTO
        +'<button type="button" onclick="var e=document.getElementById(\''+idFoto+'\');e.value=\'\';e.click();event.stopPropagation();" '
          +'style="display:flex;flex-direction:column;align-items:center;justify-content:center;'
          +'background:#f0f9ff;border:2px solid #bae6fd;border-radius:12px;padding:14px 6px;'
          +'cursor:pointer;gap:4px;width:100%;-webkit-appearance:none;appearance:none;'
          +'-webkit-tap-highlight-color:rgba(3,105,161,0.15);touch-action:manipulation">'
          +'<span style="font-size:24px">📷</span>'
          +'<span style="font-size:11px;font-weight:700;color:#0369a1;text-align:center">Tomar foto</span>'
        +'</button>'
        // Botón VIDEO
        +'<button type="button" onclick="var e=document.getElementById(\''+idVideo+'\');e.value=\'\';e.click();event.stopPropagation();" '
          +'style="display:flex;flex-direction:column;align-items:center;justify-content:center;'
          +'background:#fff0f9;border:2px solid #fbcfe8;border-radius:12px;padding:14px 6px;'
          +'cursor:pointer;gap:4px;width:100%;-webkit-appearance:none;appearance:none;'
          +'-webkit-tap-highlight-color:rgba(219,39,119,0.15);touch-action:manipulation">'
          +'<span style="font-size:24px">🎥</span>'
          +'<span style="font-size:11px;font-weight:700;color:#be185d;text-align:center">Grabar video</span>'
        +'</button>'
        // Botón GALERÍA
        +'<button type="button" onclick="var e=document.getElementById(\''+idGal+'\');e.value=\'\';e.click();event.stopPropagation();" '
          +'style="display:flex;flex-direction:column;align-items:center;justify-content:center;'
          +'background:#f5f3ff;border:2px solid #ddd6fe;border-radius:12px;padding:14px 6px;'
          +'cursor:pointer;gap:4px;width:100%;-webkit-appearance:none;appearance:none;'
          +'-webkit-tap-highlight-color:rgba(124,58,237,0.15);touch-action:manipulation">'
          +'<span style="font-size:24px">🖼️</span>'
          +'<span style="font-size:11px;font-weight:700;color:#7c3aed;text-align:center">Galería</span>'
        +'</button>'
      +'</div>'
      +'<div id="ev-prog-'+faseId+'" style="display:none;margin-top:10px;padding:10px;background:#f0fdf4;border-radius:10px;font-size:12px;color:#166534;text-align:center;font-weight:600"></div>'
    +'</div>';

  function buildGaleriaFase(o, faseId){
    var fotos=o.fotos_evidencia||[];
    if(typeof fotos==='string')try{fotos=JSON.parse(fotos);}catch(e){fotos=[];}
    function norm(s){return(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,'');}
    var normId=norm(faseId);
    // Aliases: variantes de nombre de fase -> ID normalizado
    var ALIAS={
      'RECEPCION':'RECEPCION','RECEPCION':'RECEPCION',
      'DIAGNOSTICO':'DIAGNOSTICO',
      'REPARACION':'REPARACION','ENPROCES':'REPARACION','PROCESO':'REPARACION','REPARACION':'REPARACION',
      'REPUESTOS':'REPUESTOS','COTIZACION':'REPUESTOS','PRESUPUESTO':'REPUESTOS',
      'CONTROL':'CONTROL','CONTROLCALIDAD':'CONTROL','CALIDAD':'CONTROL',
      'ENTREGA':'ENTREGA','LISTO':'ENTREGA','LISTOPARAENTREGA':'ENTREGA',
      'APROBACION':'APROBACION'
    };
    var evsFase=fotos.filter(function(f){
      var fase=norm(f.fase||'');
      if(fase===normId) return true;
      var alias=ALIAS[fase]||fase;
      if(alias===normId) return true;
      if(fase.length>=5&&normId.length>=5&&fase.slice(0,5)===normId.slice(0,5)) return true;
      return false;
    });
    if(!evsFase.length){
      return '<div style="background:#f8fafc;border-radius:12px;padding:14px;text-align:center;margin-top:8px">'
        +'<div style="font-size:11px;color:var(--text3)">Sin evidencias en esta fase aún</div>'
      +'</div>';
    }
    var html='<div style="margin-top:10px">'
      +'<div style="font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Evidencias guardadas ('+evsFase.length+')</div>'
      +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">';
    evsFase.forEach(function(ev){
      var url=(ev.path.startsWith('/')||ev.path.startsWith('http'))?ev.path:'/'+ev.path;
      var isVid=ev.tipo==='video'||/\.(mp4|mov|webm|3gp|avi)$/i.test(ev.path);
      if(isVid){
        html+='<div onclick="window.open(\''+url+'\',\'_blank\')" style="aspect-ratio:1;background:#1e3a5f;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:4px">'
          +'<div style="font-size:22px">▶</div>'
          +'<div style="font-size:9px;color:#93c5fd">Video</div>'
        +'</div>';
      } else {
        html+='<div onclick="window.open(\''+url+'\',\'_blank\')" style="aspect-ratio:1;border-radius:10px;overflow:hidden;background:#f1f5f9;cursor:pointer">'
          +'<img src="'+url+'" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML=\'<div style=padding:10px;text-align:center;font-size:10px;color:#9ca3af>Error</div>\'">'
        +'</div>';
      }
    });
    html+='</div></div>';
    return html;
  }


  // ── FUNCIONES DE GUARDADO ─────────────────────────────────────────────
  async function guardarReparacion(cons){
    var logs=document.getElementById('fe-repair-logs').value.trim();
    var r=await apiFetch('/api/ordenes/'+encodeURIComponent(cons)+'/checklist',{method:'POST',body:JSON.stringify({repair_logs:logs})});
    if(r&&r.ok){toastOk('Notas de reparación guardadas');abrirGestionOrden(cons);}
    else toastErr((r&&r.error)||'Error');
  }

  async function guardarRecepcion(cons){
    var motivo=document.getElementById('fe-motivo').value.trim();
    var km=document.getElementById('fe-km').value;
    var tecnico=document.getElementById('fe-tecnico').value.trim();
    var obs=document.getElementById('fe-obs').value.trim();
    if(!motivo){toastErr('El motivo es obligatorio');return;}
    var r=await apiFetch('/api/ordenes/'+encodeURIComponent(cons)+'/checklist',{method:'POST',body:JSON.stringify({km:km,tecnico:tecnico,observaciones:obs})});
    // Actualizar también el motivo via endpoint
    await apiFetch('/api/ordenes/'+encodeURIComponent(cons)+'/estado',{method:'PUT',body:JSON.stringify({motivo:motivo})});
    if(r&&r.ok){toastOk('Recepción guardada');abrirGestionOrden(cons);}
    else toastErr((r&&r.error)||'Error');
  }

  async function guardarDiagnostico(cons){
    var system=(document.getElementById('fe-system')||{value:''}).value.trim();
    var codes=(document.getElementById('fe-codes')||{value:''}).value.trim();
    var tests=(document.getElementById('fe-tests')||{value:''}).value.trim();
    var analysis=(document.getElementById('fe-analysis')||{value:''}).value.trim();
    var solution=(document.getElementById('fe-solution')||{value:''}).value.trim();
    if(!system&&!tests&&!analysis&&!solution){toastErr('Ingresa al menos un campo');return;}
    var r=await apiFetch('/api/ordenes/'+encodeURIComponent(cons)+'/diagnostico',{
      method:'POST',
      body:JSON.stringify({system:system,codes:codes,tests:tests,analysis:analysis,solution:solution,diagnostico:analysis||tests})
    });
    if(r&&r.ok){
      toastOk('Diagnóstico guardado');
      window._ordenActual=null;
      abrirGestionOrden(cons);
    }
    else toastErr((r&&r.error)||'Error al guardar');
  }

  // [agregarItem movida arriba con modal de inventario]







  async function guardarItems(cons){
    var o=window._ordenActual;
    var items=o.items_cotizacion||[];
    // Validar
    for(var i=0;i<items.length;i++){
      if(!items[i].nombre){toastErr('El item '+(i+1)+' no tiene nombre');return;}
    }
    var r=await apiFetch('/api/ordenes/'+encodeURIComponent(cons)+'/items',{method:'POST',body:JSON.stringify({items:items})});
    if(r&&r.ok){toastOk('Presupuesto guardado · '+r.count+' items · '+fmtMoney(r.total));abrirGestionOrden(cons);}
    else toastErr((r&&r.error)||'Error');
  }

  function toggleQC(key,btn){
    if(!window._qcState)window._qcState={};
    var cur=window._qcState[key]||{status:'',note:''};
    var newStatus=cur.status==='ok'?'':' ok';
    newStatus=newStatus.trim();
    window._qcState[key]={status:newStatus,note:cur.note||''};
    btn.textContent=newStatus==='ok'?'OK':'—';
    btn.style.background=newStatus==='ok'?'#dcfce7':'#f1f5f9';
    btn.style.color=newStatus==='ok'?'#15803d':'#9ca3af';
  }

  async function guardarControlCalidad(cons){
    if(!window._qcState)window._qcState={};
    var r=await apiFetch('/api/ordenes/'+encodeURIComponent(cons)+'/checklist',{method:'POST',body:JSON.stringify({quality_control:window._qcState})});
    if(r&&r.ok){toastOk('Control de calidad guardado');abrirGestionOrden(cons);}
    else toastErr((r&&r.error)||'Error');
  }

  async function guardarEntrega(cons){
    var notas=document.getElementById('fe-notas-entrega').value.trim();
    var prox=document.getElementById('fe-prox-mant').value.trim();
    var r=await apiFetch('/api/ordenes/'+encodeURIComponent(cons)+'/checklist',{method:'POST',body:JSON.stringify({notas_entrega:notas,proximo_mantenimiento:prox})});
    if(r&&r.ok){
      toastOk('Entrega guardada');
      window._ordenActual=null; // limpiar cache para re-fetch con notas nuevas
      abrirGestionOrden(cons);
    }
    else toastErr((r&&r.error)||'Error');
  }

  // ── SUBIDA DE EVIDENCIAS ─────────────────────────────────────────────
  async function subirEvidencias(cons,faseId,input){
    var files=Array.from(input.files);
    if(!files.length)return;

    // Mostrar progreso
    var progEl=document.getElementById('ev-prog-'+faseId);
    if(progEl){progEl.style.display='block';progEl.textContent='Preparando subida...';}

    var exitos=0;
    var urls=[];
    for(var i=0;i<files.length;i++){
      var file=files[i];
      if(progEl)progEl.textContent='Subiendo '+(i+1)+'/'+files.length+' — '+file.name.slice(0,25)+'...';
      var fd=new FormData();
      fd.append('file',file);
      fd.append('fase',faseId);
      try{
        var r=await fetch('/api/ordenes/'+encodeURIComponent(cons)+'/evidencia',{
          method:'POST',headers:{'Authorization':'Bearer '+S.token},body:fd
        });
        var data=await r.json();
        if(data.ok||data.url){
          exitos++;
          urls.push({path:data.url||data.path||'',fase:faseId,tipo:file.type.startsWith('video')?'video':'foto'});
        }
      }catch(e){console.error('upload err',e);}
    }
    input.value='';

    if(exitos>0){
      if(progEl){progEl.style.display='none';}
      toastOk('✅ '+exitos+' archivo(s) subidos');

      // Limpiar cache de la orden para forzar re-fetch con las fotos nuevas
      if(window._ordenActual && window._ordenActual.consecutivo===cons){
        window._ordenActual = null;
      }

      // Recargar la fase — mostrará las evidencias actualizadas
      setTimeout(function(){abrirFaseEditor(cons,faseId);},400);
    } else {
      if(progEl)progEl.style.display='none';
      toastErr('Error al subir — verifica tu conexión');
    }
  }

  async function subirScanner(cons,input){
    var file=input.files[0];if(!file)return;
    toastOk('Subiendo PDF...');
    var fd=new FormData();fd.append('file',file);fd.append('tipo','scanner');
    try{
      var r=await fetch('/api/ordenes/'+encodeURIComponent(cons)+'/evidencia',{
        method:'POST',headers:{'Authorization':'Bearer '+S.token},body:fd
      });
      var data=await r.json();
      if(data.ok||data.url){
        // Guardar path en diagnostic_details.scanner_path
        var o=window._ordenActual;
        var cl={};
        try{var raw=o.checklist_reparacion;if(typeof raw==='string')cl=JSON.parse(raw||'{}');else if(raw)cl=raw;}catch(e){}
        if(!cl.diagnostic_details)cl.diagnostic_details={};
        cl.diagnostic_details.scanner_path=data.url||data.path||'';
        await apiFetch('/api/ordenes/'+encodeURIComponent(cons)+'/diagnostico',{method:'POST',body:JSON.stringify({scanner_path:cl.diagnostic_details.scanner_path})});
        toastOk('PDF del escáner guardado');
        input.value='';
      }else toastErr('Error al subir PDF');
    }catch(e){toastErr('Error de red');}
  }


  // ── ROUTER ─────────────────────────────────────────────────────────
  async function eliminarOrden(consecutivo, e){
    e.stopPropagation();
    if(!confirm('Eliminar orden '+consecutivo+'? Esta accion no se puede deshacer.')) return;
    var r = await apiFetch('/api/ordenes/'+encodeURIComponent(consecutivo)+'/eliminar',{method:'POST'});
    if(r&&r.ok){toastOk('Orden eliminada');setPage(S.page);}
    else toastErr((r&&r.error)||'Error al eliminar');
  }
    function renderPage(name){
    document.getElementById('content').innerHTML='';
    switch(name){
      case 'dashboard':pageDashboard();break;
      case 'ordenes':pageOrdenes();break;
      case 'clientes':pageClientes();break;
      case 'inventario':pageInventario();break;
      case 'notas':pageNotas();break;
      case 'nueva-orden':pageNuevaOrden();break;
      case 'reportes':pageReportes();break;
      case 'gestion-orden':if(S.ordenActiva)abrirGestionOrden(S.ordenActiva);break;
      case 'mis-ordenes':pageMisOrdenes();break;
      case 'mi-flota':pageMiFlota();break;
      case 'historial':pageHistorial();break;
      case 'mis-citas':pageMisCitas();break;
      case 'agendar':pageAgendar();break;
      default:document.getElementById('content').innerHTML='<div class="sec"><div class="empty"><div class="empty-title">En desarrollo</div></div></div>';
    }
  }

  // ── ARRANQUE ────────────────────────────────────────────────────────
  window._appStarted=false;
  window.addEventListener('DOMContentLoaded',async function(){
    if(window._appStarted) return; // evitar doble arranque
    if(S.token&&S.user){
      try{
        var me=await fetch('/api/auth/me',{headers:{'Authorization':'Bearer '+S.token}});
        if(me.ok){window._appStarted=true;startApp();return;}
      }catch(e){}
    }
    var l=document.getElementById('loading');
    if(l){l.style.opacity='0';setTimeout(function(){l.remove();document.getElementById('login-screen').classList.remove('hidden');},300);}
    else document.getElementById('login-screen').classList.remove('hidden');
  });

  document.addEventListener('keydown',function(e){
    if(e.key==='Enter'){var ps=document.getElementById('panel-staff');if(ps&&!ps.classList.contains('hidden'))doLogin('staff');}
  });
