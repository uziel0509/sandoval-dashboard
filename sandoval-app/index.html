<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#274495">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sandoval Dashboard</title>
  <link rel="manifest" href="/app/manifest.json">
  <link rel="icon" href="/assets/logo_sandoval.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap');

    * {
      font-family: 'Outfit', sans-serif;
      -webkit-tap-highlight-color: transparent
    }

    body {
      background: #f1f5f9;
      overscroll-behavior: none
    }

    .slide-up {
      animation: slideUp .25s ease
    }

    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0
      }

      to {
        transform: translateY(0);
        opacity: 1
      }
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .06)
    }

    .btn-primary {
      background: linear-gradient(135deg, #274495, #1e367a);
      color: white;
      border-radius: 12px;
      padding: 14px 24px;
      font-weight: 700;
      transition: all .2s
    }

    .btn-primary:active {
      transform: scale(.97)
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #374151;
      border-radius: 12px;
      padding: 12px 20px;
      font-weight: 600
    }

    .badge {
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 700
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 12px;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 600;
      transition: .2s;
      flex: 1
    }

    .nav-tab.active {
      color: #274495
    }

    .nav-tab .mi {
      font-size: 22px
    }

    ::-webkit-scrollbar {
      display: none
    }

    input,
    textarea,
    select {
      outline: none;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      width: 100%;
      font-size: 15px;
      transition: .2s;
      background: white
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #274495;
      box-shadow: 0 0 0 3px rgba(39, 68, 149, .1)
    }

    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: white;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      z-index: 9999;
      animation: slideUp .3s ease
    }

    .chip {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700
    }

    .estado-RECEPCIÓN {
      background: #e2e8f0;
      color: #475569
    }

    .estado-DIAGNÓSTICO {
      background: #dbeafe;
      color: #1e40af
    }

    .estado-REPUESTOS {
      background: #ede9fe;
      color: #5b21b6
    }

    .estado-APROBACIÓN {
      background: #fef3c7;
      color: #92400e
    }

    .estado-REPARACIÓN {
      background: #dbeafe;
      color: #1d4ed8
    }

    .estado-CONTROL {
      background: #f0fdf4;
      color: #166534
    }

    .estado-ENTREGA {
      background: #d1fae5;
      color: #065f46
    }

    .estado-ARCHIVADO {
      background: #f1f5f9;
      color: #64748b
    }

    .estado-pagada {
      background: #d1fae5;
      color: #065f46
    }

    .estado-borrador {
      background: #fef3c7;
      color: #92400e
    }

    .estado-anulada {
      background: #fee2e2;
      color: #991b1b
    }

    .estado-confirmada {
      background: #dcfce7;
      color: #166534
    }

    .estado-cancelada {
      background: #fee2e2;
      color: #991b1b
    }

    .estado-programada {
      background: #dbeafe;
      color: #1e40af
    }

    .estado-Pendiente {
      background: #fef3c7;
      color: #92400e
    }

    .estado-Confirmada {
      background: #dbeafe;
      color: #1e40af
    }

    .estado-Completada {
      background: #d1fae5;
      color: #065f46
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .6);
      z-index: 1000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(4px)
    }

    .modal-sheet {
      background: white;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      overflow-y: auto;
      padding-bottom: env(safe-area-inset-bottom)
    }

    /* ── TRACKER 7 FASES ── */
    .phase-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      flex: 1;
      z-index: 10;
    }

    .phase-line {
      position: absolute;
      top: 15px;
      left: 0;
      right: 0;
      height: 2px;
      background: #e2e8f0;
      z-index: 1;
    }

    .phase-progress {
      position: absolute;
      top: 15px;
      left: 0;
      height: 2px;
      background: #274495;
      z-index: 2;
      transition: width 0.5s;
    }

    .step-circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: white;
      border: 2px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      transition: all 0.3s;
      position: relative;
      z-index: 3;
    }

    .phase-step.active .step-circle {
      background: #274495;
      border-color: #274495;
      color: white;
      box-shadow: 0 0 10px rgba(39, 68, 149, 0.4);
    }

    .phase-step.done .step-circle {
      background: #10b981;
      border-color: #10b981;
      color: white;
    }

    /* ── PREMIUM APPROVAL STYLES ── */
    .premium-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .technical-report {
      background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 100%);
      border-left: 5px solid #274495;
      padding: 24px;
      position: relative;
    }

    .technical-report::after {
      content: 'CONFIDENTIAL';
      position: absolute;
      top: 10px;
      right: -20px;
      font-size: 40px;
      font-weight: 900;
      color: rgba(39, 68, 149, 0.03);
      transform: rotate(-15deg);
      pointer-events: none;
    }

    .budget-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 8px;
    }

    .budget-row {
      background: #f8fafc;
      border-radius: 12px;
      transition: all 0.2s;
    }

    .budget-row:hover {
      background: #f1f5f9;
      transform: translateY(-2px);
    }

    .total-pill {
      background: linear-gradient(135deg, #274495 0%, #1e3a8a 100%);
      color: white;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 15px 30px -10px rgba(39, 68, 149, 0.3);
    }

    .approval-pulse {
      animation: pulse-green 2s infinite;
    }

    @keyframes pulse-green {
      0% {
        box-shadow: 0 0 0 0 rgba(29, 185, 122, 0.4);
      }

      70% {
        box-shadow: 0 0 0 15px rgba(29, 185, 122, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(29, 185, 122, 0);
      }
    }

    .phase-detail-overlay {
      position: fixed;
      inset: 0;
      background: #f1f5f9;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .phase-detail-overlay.open {
      transform: translateX(0);
    }

    .step-label {
      font-size: 8px;
      font-weight: 800;
      text-transform: uppercase;
      margin-top: 6px;
      text-align: center;
      color: #64748b;
      line-height: 1;
    }

    .phase-step.active .step-label {
      color: #274495;
    }

    .phase-step.done .step-label {
      color: #10b981;
    }

    /* ── DISEÑO DE CUADRITOS INTERACTIVOS (NUEVO) ── */
    .phase-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .phase-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .phase-card.done {
      background: #ecfdf5;
      border-color: #10b98133;
    }

    .phase-card.active {
      background: white;
      border-color: #274495;
      border-width: 2px;
      box-shadow: 0 10px 15px -3px rgba(39, 68, 149, 0.1);
    }

    .phase-card.pending {
      opacity: 0.6;
    }

    .phase-card .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .phase-card.done .card-icon {
      background: #10b981;
      color: white;
    }

    .phase-card.active .card-icon {
      background: #274495;
      color: white;
    }

    .phase-card.pending .card-icon {
      background: #e2e8f0;
      color: #94a3b8;
    }

    .phase-card .card-title {
      font-size: 11px;
      font-weight: 900;
      color: #1e293b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .phase-card .card-status {
      font-size: 9px;
      font-weight: 700;
    }

    .phase-card.done .card-status {
      color: #059669;
    }

    .phase-card.active .card-status {
      color: #1d4ed8;
    }

    .phase-card.pending .card-status {
      color: #64748b;
    }

    .phase-detail-overlay {
      position: fixed;
      inset: 0;
      background: white;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .phase-detail-overlay.open {
      transform: translateX(0);
    }

    .media-container {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      margin-bottom: 12px;
      position: relative;
    }

    .media-container video,
    .media-container img {
      width: 100%;
      height: auto;
      display: block;
      max-height: 400px;
      object-fit: contain;
    }

    /* ── SPLASH 3D (idéntico al desktop) ── */
    #loading {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #274495 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity .5s
    }

    .splash-logo-wrapper {
      position: relative;
      perspective: 1000px;
      margin-bottom: 32px
    }

    .splash-logo {
      width: 130px;
      height: 130px;
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(39, 68, 149, .4), 0 0 80px rgba(39, 68, 149, .3);
      animation: logo3DFloat 2s ease-in-out infinite;
      border: 3px solid rgba(255, 255, 255, .1);
      object-fit: contain;
      background: white;
      padding: 6px
    }

    @keyframes logo3DFloat {

      0%,
      100% {
        transform: translateY(0) rotateY(0deg) rotateX(0deg)
      }

      25% {
        transform: translateY(-10px) rotateY(5deg) rotateX(5deg)
      }

      50% {
        transform: translateY(0)
      }

      75% {
        transform: translateY(-10px) rotateY(-5deg) rotateX(-5deg)
      }
    }

    .splash-gears {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 240px;
      height: 240px;
      pointer-events: none
    }

    .gear {
      position: absolute;
      font-size: 70px;
      opacity: .15;
      filter: drop-shadow(0 0 20px rgba(39, 68, 149, .6))
    }

    .gear-1 {
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      animation: rotGear 3s linear infinite
    }

    .gear-2 {
      bottom: -15px;
      right: 15px;
      animation: rotGearR 4s linear infinite
    }

    .gear-3 {
      bottom: -15px;
      left: 15px;
      animation: rotGear 3.5s linear infinite
    }

    @keyframes rotGear {
      from {
        transform: translateX(-50%) rotate(0)
      }

      to {
        transform: translateX(-50%) rotate(360deg)
      }
    }

    @keyframes rotGearR {
      from {
        transform: rotate(0)
      }

      to {
        transform: rotate(-360deg)
      }
    }

    .splash-title {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: white;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: -.5px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, .3);
      animation: titleUp .8s ease .3s both
    }

    .splash-subtitle {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, .7);
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 40px;
      animation: titleUp .8s ease .5s both
    }

    @keyframes titleUp {
      from {
        opacity: 0;
        transform: translateY(20px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .splash-loader {
      width: 180px;
      height: 4px;
      background: rgba(255, 255, 255, .1);
      border-radius: 10px;
      overflow: hidden;
      animation: titleUp .8s ease .7s both
    }

    .splash-loader-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #274495, #60a5fa);
      background-size: 200% 100%;
      border-radius: 10px;
      animation: loaderProg 2.5s ease forwards, loaderShine 1.5s infinite;
      box-shadow: 0 0 20px rgba(39, 68, 149, .8)
    }

    @keyframes loaderProg {
      from {
        width: 0%
      }

      to {
        width: 100%
      }
    }

    @keyframes loaderShine {

      0%,
      100% {
        background-position: 0% 50%
      }

      50% {
        background-position: 100% 50%
      }
    }

    .splash-tools {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      opacity: .08;
      pointer-events: none
    }

    .tool-icon {
      position: absolute;
      font-size: 36px;
      animation: toolFloat 20s linear infinite
    }

    .tool-1 {
      top: 10%;
      left: 10%;
      animation-delay: 0s
    }

    .tool-2 {
      top: 20%;
      right: 15%;
      animation-delay: 2s
    }

    .tool-3 {
      bottom: 15%;
      left: 20%;
      animation-delay: 4s
    }

    .tool-4 {
      bottom: 20%;
      right: 10%;
      animation-delay: 6s
    }

    .tool-5 {
      top: 50%;
      left: 5%;
      animation-delay: 1s
    }

    .tool-6 {
      top: 50%;
      right: 5%;
      animation-delay: 3s
    }

    @keyframes toolFloat {

      0%,
      100% {
        transform: translateY(0) rotate(0)
      }

      25% {
        transform: translateY(-30px) rotate(5deg)
      }

      50% {
        transform: translateY(0)
      }

      75% {
        transform: translateY(30px) rotate(-5deg)
      }
    }

    .splash-version {
      position: absolute;
      bottom: 24px;
      font-size: 10px;
      color: rgba(255, 255, 255, .4);
      letter-spacing: 2px;
      font-weight: 600
    }
  </style>
</head>

<body>

  <!-- SPLASH 3D (mismo que desktop) -->
  <div id="loading">
    <div class="splash-tools">
      <div class="tool-icon tool-1">🔧</div>
      <div class="tool-icon tool-2">🔩</div>
      <div class="tool-icon tool-3">⚙️</div>
      <div class="tool-icon tool-4">🛠️</div>
      <div class="tool-icon tool-5">🚗</div>
      <div class="tool-icon tool-6">🔩</div>
    </div>
    <div class="splash-logo-wrapper">
      <div class="splash-gears">
        <div class="gear gear-1">⚙️</div>
        <div class="gear gear-2">⚙️</div>
        <div class="gear gear-3">⚙️</div>
      </div>
      <img src="/assets/logo_sandoval.jpg" class="splash-logo">
    </div>
    <div class="splash-title">MECÁNICA Y REPUESTOS<br>SANDOVAL EIRL</div>
    <div class="splash-subtitle">Sistema Profesional de Gestión</div>
    <div class="splash-loader">
      <div class="splash-loader-bar"></div>
    </div>
    <div class="splash-version">v2.0 PRO · 2026</div>
  </div>

  <!-- APP ROOT -->
  <div id="app" class="hidden min-h-screen flex flex-col">

    <!-- TOP BAR -->
    <header id="topbar"
      class="bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between sticky top-0 z-50 shadow-sm">
      <div class="flex items-center gap-3">
        <img src="/assets/logo_sandoval.jpg" class="w-9 h-9 rounded-xl object-contain bg-white border border-gray-100">
        <div>
          <p class="text-xs font-black text-[#274495] leading-none">SANDOVAL</p>
          <p id="topbar-section" class="text-[11px] text-gray-400 font-medium leading-none mt-0.5">Dashboard</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <div id="user-badge"
          class="w-9 h-9 rounded-full bg-[#274495] flex items-center justify-center text-white text-sm font-black">
        </div>
        <button onclick="logout()" class="w-9 h-9 rounded-full bg-red-50 flex items-center justify-center">
          <span class="material-icons-round text-red-400 text-xl">logout</span>
        </button>
      </div>
    </header>

    <!-- CONTENT -->
    <main id="content" class="flex-1 overflow-y-auto pb-24 px-4 pt-4"></main>

    <!-- BOTTOM NAV (se rellena dinámicamente) -->
    <nav id="bottom-nav"
      class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex items-center z-50 shadow-lg"
      style="padding-bottom:env(safe-area-inset-bottom)"></nav>
  </div>

  <!-- LOGIN -->
  <div id="login-screen"
    class="hidden min-h-screen flex items-center justify-center p-5 bg-gradient-to-br from-[#f8fafc] to-[#e2e8f0]">
    <div class="w-full max-w-sm slide-up">
      <div class="text-center mb-8">
        <img src="/assets/logo_sandoval.jpg"
          class="w-20 h-20 rounded-2xl shadow-lg mx-auto mb-4 object-contain bg-white p-2">
        <h1 class="text-2xl font-black text-gray-900">SANDOVAL</h1>
        <p class="text-gray-400 text-sm font-medium">Mecánica y Repuestos</p>
      </div>
      <div class="card p-6">
        <!-- Tabs -->
        <div class="flex bg-gray-100 rounded-xl p-1 mb-6">
          <button onclick="switchLoginTab('staff')" id="tab-staff"
            class="flex-1 py-2.5 rounded-lg text-sm font-bold transition-all bg-white text-[#274495] shadow-sm">Personal</button>
          <button onclick="switchLoginTab('cliente')" id="tab-cliente"
            class="flex-1 py-2.5 rounded-lg text-sm font-bold transition-all text-gray-400">Cliente</button>
        </div>
        <!-- Staff login -->
        <div id="panel-staff">
          <div class="mb-4">
            <label class="text-xs font-bold text-gray-500 mb-1 block">USUARIO</label>
            <input id="staff-user" type="text" placeholder="usuario" autocomplete="username">
          </div>
          <div class="mb-6">
            <label class="text-xs font-bold text-gray-500 mb-1 block">CONTRASEÑA</label>
            <input id="staff-pass" type="password" placeholder="••••••" autocomplete="current-password">
          </div>
          <button onclick="doLogin('staff')" class="btn-primary w-full text-center">Iniciar Sesión</button>
        </div>
        <!-- Cliente login -->
        <div id="panel-cliente" class="hidden">
          <div class="mb-4">
            <label class="text-xs font-bold text-gray-500 mb-1 block">PLACA DEL VEHÍCULO</label>
            <input id="cli-placa" type="text" placeholder="ABC-123" style="text-transform:uppercase">
          </div>
          <div class="mb-2">
            <label class="text-xs font-bold text-gray-500 mb-1 block">CONTRASEÑA</label>
            <input id="cli-pass" type="password" placeholder="DNI o RUC inicial">
          </div>
          <p class="text-[11px] text-gray-400 mb-5">Contraseña inicial: su DNI o RUC</p>
          <button onclick="doLogin('cliente')" class="btn-primary w-full text-center">Ingresar al Portal</button>
        </div>
        <p id="login-error" class="text-red-500 text-sm text-center mt-4 hidden font-medium"></p>
      </div>
    </div>
  </div>

  <script>
    // ─── REDIRECT AUTOMÁTICO ──────────────────────────────
    // Si se abre desde PC/desktop → redirigir al dashboard NiceGUI
    (function () {
      var ua = navigator.userAgent || '';
      var isMobile = /Android|iPhone|iPad|iPod|IEMobile|Opera Mini|BlackBerry|Mobile/i.test(ua);
      var isDesktop = !isMobile && window.innerWidth >= 1024;
      if (isDesktop) {
        // Solo redirigir si no hay sesión activa guardada
        var hasSession = localStorage.getItem('s_token');
        if (!hasSession) {
          window.location.replace('/login');
        }
      }
    })();

    // ─── ESTADO GLOBAL ────────────────────────────────────
    const S = {
      token: localStorage.getItem('s_token'),
      user: JSON.parse(localStorage.getItem('s_user') || 'null'),
      page: 'dashboard',
    };

    const API = '';  // mismo origen

    // ─── UTILIDADES ───────────────────────────────────────
    async function apiFetch(path, opts = {}) {
      const res = await fetch(API + path, {
        headers: { 'Authorization': 'Bearer ' + S.token, 'Content-Type': 'application/json', ...(opts.headers || {}) },
        ...opts,
      });
      if (res.status === 401) { logout(); return null; }
      return res.json();
    }

    function toast(msg, color = '#1e293b') {
      const el = document.createElement('div');
      el.className = 'toast';
      el.style.background = color;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2800);
    }
    function toastOk(m) { toast('✓ ' + m, '#065f46'); }
    function toastErr(m) { toast('✗ ' + m, '#991b1b'); }

    function chip(estado) {
      return `<span class="chip estado-${estado}">${estado}</span>`;
    }

    function fmtDate(d) {
      if (!d) return '—';
      return new Date(d).toLocaleDateString('es-PE', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function fmtMoney(n) {
      return 'S/ ' + Number(n || 0).toLocaleString('es-PE', { minimumFractionDigits: 2 });
    }

    function setPage(name) {
      S.page = name;
      document.getElementById('topbar-section').textContent = NAV_LABELS[name] || name;
      // Actualizar nav activo
      document.querySelectorAll('.nav-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.page === name);
      });
      renderPage(name);
    }

    // ─── LOGIN ────────────────────────────────────────────
    function switchLoginTab(tab) {
      const isStaff = tab === 'staff';
      document.getElementById('panel-staff').classList.toggle('hidden', !isStaff);
      document.getElementById('panel-cliente').classList.toggle('hidden', isStaff);
      document.getElementById('tab-staff').className = 'flex-1 py-2.5 rounded-lg text-sm font-bold transition-all ' + (isStaff ? 'bg-white text-[#274495] shadow-sm' : 'text-gray-400');
      document.getElementById('tab-cliente').className = 'flex-1 py-2.5 rounded-lg text-sm font-bold transition-all ' + (!isStaff ? 'bg-white text-[#274495] shadow-sm' : 'text-gray-400');
    }

    async function doLogin(tipo) {
      const body = tipo === 'staff'
        ? { tipo: 'staff', username: document.getElementById('staff-user').value.trim(), password: document.getElementById('staff-pass').value }
        : { tipo: 'cliente', placa: document.getElementById('cli-placa').value.trim().toUpperCase(), password: document.getElementById('cli-pass').value.trim() };

      const errEl = document.getElementById('login-error');
      errEl.classList.add('hidden');
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        let data;
        const text = await res.text();
        try { data = JSON.parse(text); }
        catch (je) { errEl.textContent = 'Resp. inesperada (' + res.status + '): ' + text.slice(0, 80); errEl.classList.remove('hidden'); return; }
        if (!res.ok) { errEl.textContent = data.error || 'Error ' + res.status; errEl.classList.remove('hidden'); return; }
        S.token = data.token;
        S.user = data.user;
        localStorage.setItem('s_token', S.token);
        localStorage.setItem('s_user', JSON.stringify(S.user));
        startApp();
      } catch (e) {
        errEl.textContent = 'Fetch error: ' + (e.message || String(e));
        errEl.classList.remove('hidden');
      }
    }

    function logout() {
      fetch('/api/auth/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + S.token } }).catch(() => { });
      S.token = null; S.user = null;
      localStorage.removeItem('s_token');
      localStorage.removeItem('s_user');
      document.getElementById('app').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
    }

    // ─── APP INIT ─────────────────────────────────────────
    function isAdmin() {
      return S.user && ['admin', 'recepcionista', 'tecnico'].includes(S.user.rol);
    }

    const NAV_LABELS = {
      dashboard: 'Dashboard', ordenes: 'Órdenes', clientes: 'Clientes',
      inventario: 'Inventario', notas: 'Notas de Venta', citas: 'Citas',
      'mis-ordenes': 'Mis Órdenes', 'mis-citas': 'Mis Citas', 'agendar': 'Agendar Cita',
    };

    const ADMIN_NAV = [
      { page: 'dashboard', icon: 'grid_view', label: 'Dashboard' },
      { page: 'ordenes', icon: 'build', label: 'Órdenes' },
      { page: 'clientes', icon: 'people', label: 'Clientes' },
      { page: 'inventario', icon: 'inventory_2', label: 'Inventario' },
      { page: 'notas', icon: 'receipt_long', label: 'Ventas' },
    ];

    const CLIENT_NAV = [
      { page: 'mis-ordenes', icon: 'build_circle', label: 'Mis Órdenes' },
      { page: 'mis-citas', icon: 'event', label: 'Mis Citas' },
      { page: 'agendar', icon: 'add_circle', label: 'Agendar' },
    ];

    function buildNav(items) {
      const nav = document.getElementById('bottom-nav');
      nav.innerHTML = items.map(it => `
    <button class="nav-tab ${S.page === it.page ? 'active' : ''}" data-page="${it.page}" onclick="setPage('${it.page}')">
      <span class="material-icons-round mi">${it.icon}</span>
      <span>${it.label}</span>
    </button>
  `).join('');
    }

    function startApp() {
      const loadingEl = document.getElementById('loading');
      if (loadingEl) {
        loadingEl.style.opacity = '0';
        setTimeout(() => loadingEl.remove(), 400);
      }
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      const initials = (S.user?.nombre || 'U').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
      document.getElementById('user-badge').textContent = initials;
      const nav = isAdmin() ? ADMIN_NAV : CLIENT_NAV;
      buildNav(nav);
      const firstPage = isAdmin() ? 'dashboard' : 'mis-ordenes';
      setPage(firstPage);
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('/app/sw.js').catch(() => { });
    }

    // ─── PÁGINAS ADMIN ────────────────────────────────────
    async function pageDashboard() {
      const c = document.getElementById('content');
      c.innerHTML = '<div class="text-center py-10 text-gray-400">Cargando...</div>';
      const d = await apiFetch('/api/dashboard');
      if (!d) return;
      c.innerHTML = `
  <div class="slide-up">
    <h2 class="text-xl font-black text-gray-900 mb-4">Panel de Control</h2>
    <div class="grid grid-cols-2 gap-3 mb-4">
      ${kpiCard('Órdenes Activas', d.n_ordenes_activas, 'engineering', '#274495', '#eff6ff')}
      ${kpiCard('Clientes', d.n_clientes, 'groups', '#6366f1', '#eef2ff')}
      ${kpiCard('Ingresos Taller', fmtMoney(d.total_ingresos), 'payments', '#10b981', '#f0fdf4')}
      ${kpiCard('Ventas Mes', fmtMoney(d.ventas_mes), 'receipt_long', '#f59e0b', '#fffbeb')}
    </div>
    ${d.stock_bajo > 0 ? `<div class="card p-4 mb-4 border border-red-100 bg-red-50">
      <div class="flex items-center gap-3">
        <span class="material-icons-round text-red-500">warning</span>
        <div><p class="font-bold text-red-700 text-sm">Stock bajo en ${d.stock_bajo} productos</p><p class="text-xs text-red-400">Revisar inventario</p></div>
      </div>
    </div>` : ''}
    <div class="card p-4 mb-4">
      <p class="text-xs font-black text-gray-400 tracking-widest mb-3">ESTADOS DEL TALLER</p>
      ${Object.entries(d.estados).filter(([, v]) => v > 0).map(([est, cnt]) => `
        <div class="flex items-center justify-between py-2 border-b border-gray-50 last:border-0">
          <div class="flex items-center gap-2">${chip(est)}</div>
          <span class="font-black text-gray-700">${cnt}</span>
        </div>`).join('')}
    </div>
    <button onclick="setPage('ordenes')" class="btn-primary w-full text-center">Ver Órdenes</button>
  </div>`;
    }

    function kpiCard(title, value, icon, color, bg) {
      return `<div class="card p-4">
    <div class="w-10 h-10 rounded-xl flex items-center justify-center mb-3" style="background:${bg}">
      <span class="material-icons-round" style="color:${color};font-size:20px">${icon}</span>
    </div>
    <p class="text-[10px] font-black text-gray-400 tracking-widest">${title.toUpperCase()}</p>
    <p class="text-lg font-black text-gray-900 mt-1">${value}</p>
  </div>`;
    }

    // ─── ÓRDENES ──────────────────────────────────────────
    async function pageOrdenes() {
      const c = document.getElementById('content');
      c.innerHTML = '<div class="text-center py-10 text-gray-400">Cargando...</div>';
      const data = await apiFetch('/api/ordenes');
      if (!data) return;
      c.innerHTML = `
  <div class="slide-up">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-black text-gray-900">Órdenes</h2>
      <button onclick="showNuevaOrden()" class="btn-primary py-2 px-4 text-sm">+ Nueva</button>
    </div>
    ${data.length === 0 ? '<div class="card p-10 text-center text-gray-400">Sin órdenes</div>' :
          data.map(o => `
      <div class="card p-4 mb-3 cursor-pointer active:scale-[.98] transition-all" onclick="showOrden('${o.consecutivo}')">
        <div class="flex items-start justify-between mb-2">
          <div>
            <p class="font-black text-[#274495] text-sm">${o.consecutivo}</p>
            <p class="font-bold text-gray-700 text-sm">${o.cliente_nombre}</p>
          </div>
          ${chip(o.estado)}
        </div>
        <div class="flex items-center gap-3 text-xs text-gray-400">
          <span class="flex items-center gap-1"><span class="material-icons-round" style="font-size:14px">directions_car</span>${o.vehiculo_placa || '—'}</span>
          <span>${fmtDate(o.fecha)}</span>
        </div>
    <div class="flex items-center justify-between py-2 border-b border-gray-100 text-sm">
      <span class="flex-1">${it.nombre} x${it.cantidad}</span>
      <span class="font-bold text-green-700 mr-2">${fmtMoney(it.subtotal)}</span>
    </div>`).join('')}
  </div>`;
    }

    async function showNuevaOrden() {
      const clientes = await apiFetch('/api/clientes?q=') || [];
      const cliOpts = clientes.map(c => `<option value="${c.id}">${c.nombre} ${c.apellidos} (${c.id})</option>`).join('');
      openSheet(`
    <div class="p-5">
      <p class="text-lg font-black text-gray-900 mb-5">Nueva Orden de Servicio</p>

      <!-- CLIENTE -->
      <div class="mb-3">
        <div class="flex items-center justify-between mb-1">
          <label class="text-xs font-bold text-gray-400">CLIENTE</label>
          <button onclick="toggleSection('form-nuevo-cli')" class="text-xs text-[#274495] font-bold flex items-center gap-1">
            <span class="material-icons-round" style="font-size:14px">person_add</span> Nuevo cliente
          </button>
        </div>
        <select id="no-cliente" onchange="cargarVehiculos(this.value)">
          <option value="">— Seleccionar cliente —</option>
          ${cliOpts}
        </select>
      </div>

      <!-- FORM NUEVO CLIENTE -->
      <div id="form-nuevo-cli" class="hidden bg-blue-50 rounded-xl p-4 mb-3 border border-blue-100">
        <p class="text-xs font-black text-blue-700 mb-3">✦ NUEVO CLIENTE</p>
        <div class="grid grid-cols-2 gap-2 mb-2">
          <input id="nc2-id" placeholder="DNI/RUC *">
          <input id="nc2-tel" type="tel" placeholder="Teléfono">
        </div>
        <div class="grid grid-cols-2 gap-2 mb-3">
          <input id="nc2-nom" placeholder="Nombres *">
          <input id="nc2-ape" placeholder="Apellidos">
        </div>
        <button onclick="crearClienteRapido()" class="w-full bg-[#274495] text-white rounded-xl py-2.5 text-sm font-bold">
          Guardar Cliente
        </button>
      </div>

      <!-- VEHÍCULO -->
      <div class="mb-3">
        <div class="flex items-center justify-between mb-1">
          <label class="text-xs font-bold text-gray-400">VEHÍCULO</label>
          <button onclick="toggleSection('form-nuevo-veh')" class="text-xs text-green-700 font-bold flex items-center gap-1">
            <span class="material-icons-round" style="font-size:14px">directions_car</span> Nuevo vehículo
          </button>
        </div>
        <select id="no-placa">
          <option value="">— Seleccionar cliente primero —</option>
        </select>
      </div>

      <!-- FORM NUEVO VEHÍCULO -->
      <div id="form-nuevo-veh" class="hidden bg-green-50 rounded-xl p-4 mb-3 border border-green-100">
        <p class="text-xs font-black text-green-700 mb-3">✦ NUEVO VEHÍCULO</p>
        <div class="grid grid-cols-2 gap-2 mb-2">
          <input id="nv2-placa" placeholder="PLACA *" style="text-transform:uppercase">
          <input id="nv2-color" placeholder="Color">
        </div>
        <div class="grid grid-cols-2 gap-2 mb-2">
          <input id="nv2-marca" placeholder="Marca">
          <input id="nv2-modelo" placeholder="Modelo">
        </div>
        <div class="grid grid-cols-2 gap-2 mb-3">
          <input id="nv2-año" type="number" placeholder="Año">
          <select id="nv2-tipo">
            <option>Sedán</option><option>SUV</option><option>Pick-up</option>
            <option>Hatchback</option><option>Van</option><option>Camión</option>
          </select>
        </div>
        <button onclick="crearVehiculoRapido()" class="w-full bg-green-700 text-white rounded-xl py-2.5 text-sm font-bold">
          Guardar Vehículo
        </button>
      </div>

      <!-- DATOS ORDEN -->
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div>
          <label class="text-xs font-bold text-gray-400 block mb-1">KILOMETRAJE</label>
          <input id="no-km" type="number" placeholder="Ej: 45000">
        </div>
        <div>
          <label class="text-xs font-bold text-gray-400 block mb-1">TIPO</label>
          <select id="no-tipo">
            <option>Express</option><option>Correctivo</option>
            <option>Preventivo</option><option>Garantía</option>
          </select>
        </div>
      </div>
      <div class="mb-3">
        <label class="text-xs font-bold text-gray-400 block mb-1">TÉCNICO ASIGNADO</label>
        <input id="no-tecnico" placeholder="Nombre del técnico">
      </div>
      <div class="mb-3">
        <label class="text-xs font-bold text-gray-400 block mb-1">MOTIVO / PROBLEMA *</label>
        <textarea id="no-motivo" rows="3" placeholder="Describa el problema informado por el cliente..."></textarea>
      </div>
      <div class="mb-5">
        <label class="text-xs font-bold text-gray-400 block mb-1">OBSERVACIONES</label>
        <textarea id="no-obs" rows="2" placeholder="Estado del vehículo, accesorios, etc..."></textarea>
      </div>
      <button onclick="guardarNuevaOrden()" class="btn-primary w-full text-center">
        Crear Orden de Servicio
      </button>
    </div>
  `);
    }

    function toggleSection(id) {
      document.getElementById(id)?.classList.toggle('hidden');
    }

    async function crearClienteRapido() {
      const id = document.getElementById('nc2-id').value.trim();
      const nombre = document.getElementById('nc2-nom').value.trim();
      if (!id || !nombre) { toastErr('DNI y nombre son obligatorios'); return; }
      const r = await apiFetch('/api/clientes/nuevo', {
        method: 'POST',
        body: JSON.stringify({
          id, nombre,
          apellidos: document.getElementById('nc2-ape').value,
          telefono: document.getElementById('nc2-tel').value,
        })
      });
      if (r && r.ok) {
        toastOk('Cliente creado: ' + nombre);
        const sel = document.getElementById('no-cliente');
        const opt = document.createElement('option');
        opt.value = id; opt.selected = true;
        opt.textContent = `${nombre} (${id})`;
        sel.appendChild(opt); sel.value = id;
        document.getElementById('form-nuevo-cli').classList.add('hidden');
        cargarVehiculos(id);
      } else toastErr(r?.error || 'Error al crear cliente');
    }

    async function cargarVehiculos(clienteId) {
      if (!clienteId) return;
      const veh = await apiFetch('/api/clientes/' + clienteId + '/vehiculos') || [];
      const sel = document.getElementById('no-placa');
      if (!sel) return;
      sel.innerHTML = veh.length
        ? veh.map(v => `<option value="${v.placa}">${v.placa} — ${v.marca} ${v.modelo}</option>`).join('')
        : '<option value="">— Sin vehículos, usa "+ Nuevo vehículo" —</option>';
    }

    async function crearVehiculoRapido() {
      const placa = (document.getElementById('nv2-placa').value || '').trim().toUpperCase();
      if (!placa) { toastErr('Placa es obligatoria'); return; }
      const clienteId = document.getElementById('no-cliente').value;
      const r = await apiFetch('/api/vehiculos/nuevo', {
        method: 'POST',
        body: JSON.stringify({
          placa,
          cliente_id: clienteId || null,
          marca: document.getElementById('nv2-marca').value,
          modelo: document.getElementById('nv2-modelo').value,
          año: document.getElementById('nv2-año').value,
          color: document.getElementById('nv2-color').value,
          tipo: document.getElementById('nv2-tipo').value,
        })
      });
      if (r && r.ok) {
        toastOk('Vehículo registrado: ' + placa);
        const sel = document.getElementById('no-placa');
        const opt = document.createElement('option');
        opt.value = placa; opt.selected = true;
        opt.textContent = `${placa} — ${document.getElementById('nv2-marca').value} ${document.getElementById('nv2-modelo').value}`;
        sel.appendChild(opt); sel.value = placa;
        document.getElementById('form-nuevo-veh').classList.add('hidden');
      } else toastErr(r?.error || 'Error al crear vehículo');
    }

    async function guardarNuevaOrden() {
      const motivo = document.getElementById('no-motivo').value.trim();
      if (!motivo) { toastErr('El motivo del problema es obligatorio'); return; }
      const body = {
        cliente_id: document.getElementById('no-cliente').value || null,
        vehiculo_placa: document.getElementById('no-placa').value || null,
        motivo,
        km: document.getElementById('no-km').value,
        tecnico: document.getElementById('no-tecnico').value,
        tipo: document.getElementById('no-tipo').value,
        observaciones: document.getElementById('no-obs').value,
      };
      const r = await apiFetch('/api/ordenes/nueva', { method: 'POST', body: JSON.stringify(body) });
      if (!r?.ok) { toastErr(r?.error || 'Error al crear orden'); return; }

      const cons = r.consecutivo;
      closeSheet();
      // Pantalla de éxito + subir evidencia
      openSheet(`
    <div class="p-5">
      <div class="text-center mb-5">
        <div class="w-16 h-16 bg-green-100 rounded-2xl flex items-center justify-center mx-auto mb-3">
          <span class="material-icons-round text-green-600" style="font-size:32px">check_circle</span>
        </div>
        <p class="text-xl font-black text-gray-900">¡Orden Creada!</p>
        <p class="text-[#274495] font-bold text-lg">${cons}</p>
      </div>

      <div class="card p-4 mb-4 border border-blue-100 bg-blue-50">
        <p class="text-xs font-black text-blue-700 mb-3">📸 EVIDENCIA MULTIMEDIA</p>
        <p class="text-xs text-gray-500 mb-3">Sube fotos o videos del vehículo (daños, estado, etc.)</p>
        <input type="file" id="ev-input" accept="image/*,video/*" multiple
          class="hidden" onchange="subirEvidenciaInline('${cons}', this)">
        <button onclick="document.getElementById('ev-input').click()"
          class="w-full border-2 border-dashed border-blue-300 rounded-xl py-4 text-blue-600 font-bold text-sm flex items-center justify-center gap-2">
          <span class="material-icons-round">perm_media</span>
          Tomar / Seleccionar Multimedia
        </button>
        <div id="ev-preview" class="grid grid-cols-3 gap-2 mt-3"></div>
        <p id="ev-count" class="text-xs text-center text-gray-400 mt-2"></p>
      </div>

      <button onclick="closeSheet(); pageOrdenes();" class="btn-primary w-full text-center mb-3">
        Continuar al listado
      </button>
    </div>
  `);
    }

    async function subirEvidenciaInline(cons, input) {
      const files = Array.from(input.files);
      const preview = document.getElementById('ev-preview');
      const countEl = document.getElementById('ev-count');
      let subidas = 0;
      for (const file of files) {
        const fd = new FormData();
        fd.append('file', file);
        try {
          const res = await fetch(`/api/ordenes/${cons}/evidencia`, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + S.token },
            body: fd,
          });
          const data = await res.json();
          if (data.ok) {
            subidas++;
            if (preview) {
              const isVid = data.url.toLowerCase().endsWith('.mp4') || data.url.toLowerCase().endsWith('.mov');
              const item = document.createElement('div');
              item.className = 'w-full h-24 rounded-xl border border-gray-100 overflow-hidden relative bg-gray-100';
              if (isVid) {
                item.innerHTML = `<div class="w-full h-full flex items-center justify-center text-gray-400"><span class="material-icons-round">videocam</span></div>`;
              } else {
                item.innerHTML = `<img src="${data.url}" class="w-full h-full object-cover">`;
              }
              preview.appendChild(item);
            }
          } else toastErr('Error: ' + (data.error || 'fallo al subir'));
        } catch (e) { toastErr('Error de conexión'); }
      }
      if (subidas > 0 && countEl) countEl.textContent = `${subidas} archivo(s) subido(s)`;
      if (subidas > 0) toastOk(`${subidas} archivo(s) subido(s) correctamente`);
    }

    async function showOrden(cons) {
      const o = await apiFetch('/api/ordenes/' + cons);
      if (!o) return;
      const ESTADOS = ['RECEPCIÓN', 'DIAGNÓSTICO', 'REPUESTOS', 'APROBACIÓN', 'REPARACIÓN', 'CONTROL', 'ENTREGA', 'ARCHIVADO'];
      const totalItems = (o.items || []).reduce((s, it) => s + (it.total || it.subtotal || 0), 0);
      openSheet(`

    function renderFaseMedia(o, faseNombre) {
      let medios = [];
      try {
        // Fuente A: fotos_evidencia
        let raw = o.fotos_evidencia;
        if (typeof raw === 'string' && raw.trim().startsWith('[')) raw = JSON.parse(raw);
        if (!Array.isArray(raw)) raw = raw ? [raw] : [];
        raw.forEach(m => {
          if (typeof m === 'object' && m.path) medios.push(m);
          else if (typeof m === 'string') {
            let f = 'RECEPCIÓN';
            if (m.toUpperCase().includes('DIAG')) f = 'DIAGNÓSTICO';
            if (m.toUpperCase().includes('REP') || m.toUpperCase().includes('FIX')) f = 'REPARACIÓN';
            medios.push({ path: m, fase: f });
          }
        });

        // Fuente B: checklist_reparacion
        let chk = (typeof o.checklist_reparacion === 'string') ? JSON.parse(o.checklist_reparacion || '{}') : (o.checklist_reparacion || {});
        let ev_cats = chk.evidence_cats || {};
        for (let cat in ev_cats) {
          (ev_cats[cat] || []).forEach(m => {
            if (typeof m === 'string') medios.push({ path: m, fase: cat });
            else if (typeof m === 'object' && m.path) medios.push(m);
          });
        }
      } catch (e) { console.error("Error en renderFaseMedia:", e); }

      const normalize = (t) => (t || '').toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
      const fn = normalize(faseNombre);

      const filtered = medios.filter(m => normalize(m.fase) === fn).map(m => m.path);

      if (!filtered.length) return '<div class="bg-gray-50 border-2 border-dashed border-gray-200 rounded-2xl p-8 text-center text-gray-400 text-[10px] font-black italic uppercase tracking-widest opacity-60">Sin archivos en esta fase</div>';

      return `
        <div class="space-y-4">
          ${filtered.map(path => {
        const isVideo = path.toLowerCase().endsWith('.mp4') || path.toLowerCase().endsWith('.mov') || path.toLowerCase().endsWith('.webm');
        if (isVideo) {
          return `
                <div class="media-container shadow-lg">
                  <video controls playsinline preload="metadata" class="rounded-2xl">
                    <source src="${path}">
                  </video>
                </div>`;
        } else {
          return `
                <div class="media-container shadow-md border border-gray-100">
                  <img src="${path}" class="w-full rounded-2xl" onclick="window.open('${path}')">
                </div>`;
        }
      }).join('')}
        </div>
      `;
    }

                <button onclick="window.open('${sc_path}')" class="w-full bg-[#1e293b] text-white py-4 rounded-2xl font-black text-xs flex items-center justify-center gap-2 shadow-xl hover:bg-black transition-all mb-4">
                  <span class="material-icons-round">analytics</span> VER REPORTE ELECTRÓNICO
                </button>
              ` : ''}

              <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3 border-t pt-4">📸 Evidencia Multimedia</p>
              ${renderFaseMedia(o, 'DIAGNÓSTICO')}
            </div>
          </div>

          <!-- 3. PRESUPUESTO RESUMEN -->
          <div class="premium-card p-6 mb-8 border-t-4 border-emerald-500">
            <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-4">🔩 Resumen de Inversión</p>
            <div class="total-pill bg-gradient-to-br from-emerald-600 to-emerald-800 shadow-emerald-200">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-[9px] font-black text-white/50 tracking-widest uppercase">Importe a Autorizar</p>
                        <p class="text-4xl font-black tracking-tighter italic">${fmtMoney(total)}</p>
                    </div>
                    <span class="material-icons-round text-white/20" style="font-size:40px">check_circle</span>
                </div>
            </div>
          </div>
          
          <!-- 4. GARANTÍA Y POLÍTICA -->
          <div class="bg-blue-50/50 border border-blue-100/50 p-6 rounded-[32px] mb-8 relative">
             <div class="flex gap-4">
                <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 shrink-0">
                  <span class="material-icons-round" style="font-size:20px">info</span>
                </div>
                <div>
                  <p class="text-xs font-black text-blue-900 uppercase tracking-widest mb-1">Nota Importante</p>
                  <p class="text-[11px] text-gray-600 leading-relaxed font-medium">Una vez otorgada la autorización, coordine el adelanto con administración al 924980586 para iniciar los trabajos.</p>
                </div>
             </div>
          </div>

          <!-- 5. PANEL DE ACCIÓN -->
          ${o.estado === 'APROBACIÓN' ? `
            <div id="approval-box" class="premium-card p-8 mb-10 border-t-4 border-emerald-500 shadow-2xl scale-105 transform origin-top">
              <h4 class="text-center text-gray-900 font-black text-base italic mb-6">¿Autoriza el inicio de los trabajos?</h4>
              <div class="flex gap-4">
                <button onclick="aprobarOrden('${o.consecutivo}',false)" class="flex-1 bg-gray-100 text-gray-400 rounded-2xl py-4 text-[10px] font-black uppercase tracking-widest">Posponer</button>
                <button onclick="aprobarOrden('${o.consecutivo}',true)" class="flex-1 bg-emerald-500 text-white rounded-2xl py-5 text-sm font-black shadow-xl tracking-widest active:scale-95 transition-all">
                  AUTORIZAR AHORA
                </button>
              </div>
            </div>
          ` : ''}
        `;
      } else if (phaseId === 'REPARACIÓN') {
        contentHtml = `
          <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm mb-6">
            <p class="text-[9px] text-blue-600 font-black uppercase tracking-widest mb-2">Estado del Vehículo</p>
            <p class="text-sm text-gray-700 leading-relaxed">Su vehículo se encuentra en manos de nuestros técnicos. Estamos ejecutando los trabajos aprobados con la máxima precisión técnica.</p>
          </div>
        `;
      } else {
        contentHtml = `<p class="text-sm text-gray-500 italic mb-6 text-center">Información en proceso para esta fase.</p>`;
      }

      overlay.innerHTML = `
        <div class="flex items-center p-4 border-b bg-white sticky top-0 z-50">
          <button onclick="this.closest('.phase-detail-overlay').classList.remove('open'); setTimeout(()=>this.closest('.phase-detail-overlay').remove(),400)" class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center mr-3 border">
            <span class="material-icons-round text-gray-600">arrow_back</span>
          </button>
          <div class="flex-1">
            <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">${o.consecutivo}</p>
            <p class="font-black text-gray-900 leading-tight">${phaseId}</p>
          </div>
        </div>
        <div class="flex-1 overflow-y-auto p-5 pb-28">
          ${contentHtml}
          ${phaseId !== 'APROBACIÓN' && phaseId !== 'REPUESTOS' ? `
             <p class="text-[10px] font-black text-gray-400 tracking-widest mb-3 uppercase">Evidencia Multimedia</p>
             ${renderFaseMedia(o, phaseId)}
          ` : ''}
        </div>
        <div class="fixed bottom-6 left-6 right-6 z-[2100]">
           <button onclick="window.open('https://wa.me/51924980586')" class="w-full bg-[#1db97a] text-white rounded-2xl py-4 font-black flex items-center justify-center gap-2 shadow-2xl active:scale-95 transition-all">
             <span class="material-icons-round">chat</span> CONSULTAR SOBRE ESTA FASE
           </button>
        </div>
      `;
      document.body.appendChild(overlay);
      setTimeout(() => overlay.classList.add('open'), 10);
    }


    function showClienteOrden(o) {
      openSheet(`
    <div class="p-5">
      <!-- HEADER DETALLE -->
      <div class="flex justify-between items-center mb-2">
        <div>
          <p class="text-[10px] font-black text-gray-400 tracking-widest uppercase">ORDEN DE SERVICIO</p>
          <p class="text-xl font-black text-[#274495]">${o.consecutivo}</p>
        </div>
        ${chip(o.estado)}
      </div>
      <p class="text-xs text-gray-400 mb-6">${o.vehiculo_placa} ${o.vehiculo_marca} — ${fmtDate(o.fecha)}</p>

      <!-- BOTONES DE FASES (CUADRITOS) -->
      <p class="text-[10px] font-black text-gray-400 tracking-widest mb-3 uppercase border-b pb-2">Seguimiento de 7 Fases</p>
      <p class="text-[11px] text-gray-500 mb-4">Haz clic en cada fase para ver el detalle y evidencias (fotos/videos).</p>
      
      ${renderTracker(o)}

      <div class="mt-8 p-4 bg-blue-50 rounded-2xl flex items-center justify-between border border-blue-100">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-[#274495] rounded-full flex items-center justify-center text-white shadow-sm"><span class="material-icons-round">support_agent</span></div>
          <div><p class="text-[10px] font-black text-gray-400 leading-none">ASISTENCIA</p><p class="text-xs font-bold text-gray-800">Mecánica Sandoval</p></div>
        </div>
        <button onclick="window.open('https://wa.me/51924980586')" class="bg-white text-[#25D366] p-2 rounded-xl shadow-sm border"><span class="material-icons-round">whatsapp</span></button>
      </div>
    </div>`);
    }

    async function aprobarOrden(id, aprobado) {
      if (!aprobado) {
        const r = await apiFetch('/api/cliente/aprobar', { method: 'POST', body: JSON.stringify({ orden_id: id, aprobado: false }) });
        if (r && r.ok) { toastOk('Cotización pospuesta'); closeSheet(); pageMisOrdenes(); }
        else toastErr(r?.error || 'Error');
        return;
      }

      const r = await apiFetch('/api/cliente/aprobar', { method: 'POST', body: JSON.stringify({ orden_id: id, aprobado: true }) });
      if (r && r.ok) {
        toastOk('¡ORDEN AUTORIZADA!');
        const overlay = document.getElementById('phase-detail');
        if (overlay) {
          overlay.innerHTML = `
            <div class="flex flex-col items-center justify-center h-full p-8 text-center animate-pulse">
              <span class="material-icons-round text-emerald-500 text-8xl mb-6">verified</span>
              <h2 class="text-3xl font-black text-gray-900 leading-tight">¡TRABAJOS AUTORIZADOS!</h2>
              <p class="text-sm text-gray-500 mt-4 font-bold uppercase tracking-widest leading-relaxed">Redirigiendo a WhatsApp para coordinar el inicio de la reparación...</p>
            </div>
          `;
        }
        setTimeout(() => {
          const msg = `Hola, acabo de aprobar mi presupuesto desde el aplicativo móvil.`;
          window.location.href = `https://wa.me/51924980586?text=${encodeURIComponent(msg)}`;
        }, 2500);
      } else {
        toastErr(r?.error || 'Error al autorizar');
      }
    }

    // ─── CLIENTE: CITAS ───────────────────────────────────
    async function pageMisCitas() {
      const c = document.getElementById('content');
      c.innerHTML = '<div class="text-center py-10 text-gray-400">Cargando...</div>';
      const data = await apiFetch('/api/cliente/mis-citas');
      if (!data) return;
      c.innerHTML = `
  <div class="slide-up">
    <h2 class="text-xl font-black text-gray-900 mb-4">Mis Citas</h2>
    ${data.length === 0 ? '<div class="card p-10 text-center text-gray-400">Sin citas agendadas</div>' :
          data.map(c => {
            let statusMsg = "";
            let cardCls = "card p-4 mb-3 border-l-4";
            if (c.estado === 'cancelada') {
              cardCls += " bg-red-50 border-red-400 opacity-90";
              statusMsg = `<div class="mt-2 p-2 bg-white/60 rounded-lg border border-red-100 text-[10px] text-red-600 font-bold uppercase leading-tight tracking-tighter">⚠️ LO SENTIMOS. Debido a una saturación técnica en taller para esta fecha, su cita ha sido declinada. Por favor, intente con otro horario para darle el servicio premium que merece.</div>`;
            } else if (c.estado === 'confirmada') {
              cardCls += " bg-emerald-50 border-emerald-500 shadow-sm";
              statusMsg = `<div class="mt-3 p-3 bg-white rounded-xl border border-emerald-100 text-[10px] text-emerald-700 font-black uppercase leading-tight tracking-widest flex items-center gap-2">
                <span class="material-icons-round text-sm animate-pulse">verified</span>
                ¡CITA CONFIRMADA! LO ESPERAMOS EN TALLER. SU VEHÍCULO QUEDA PROGRAMADO PARA NUESTRA ATENCIÓN ESPECIALIZADA.
              </div>`;
            } else if (c.estado === 'programada') {
              cardCls += " border-blue-400";
              statusMsg = `<div class="mt-2 text-[9px] text-blue-400 font-bold uppercase tracking-widest px-1">⏳ Esperando validación de administración...</div>`;
            }
            return `
        <div class="${cardCls}">
          <div class="flex items-center justify-between mb-1">
            <p class="font-bold text-gray-800">${fmtDate(c.fecha)}</p>
            ${chip(c.estado)}
          </div>
          <p class="text-sm text-gray-600 font-medium">${c.descripcion || 'Servicio técnico programado'}</p>
          ${statusMsg}
        </div>`}).join('')}
  </div>`;
    }

    function pageAgendar() {
      const c = document.getElementById('content');
      c.innerHTML = `
  <div class="slide-up">
    <h2 class="text-xl font-black text-gray-900 mb-6">Agendar Cita</h2>
    <div class="card p-5">
      <div class="mb-4"><label class="text-xs font-bold text-gray-400 block mb-1">FECHA Y HORA</label><input id="ag-fecha" type="datetime-local"></div>
      <div class="mb-4"><label class="text-xs font-bold text-gray-400 block mb-1">PLACA DEL VEHÍCULO</label><input id="ag-placa" value="${S.user?.placa || ''}" placeholder="ABC-123"></div>
      <div class="mb-6"><label class="text-xs font-bold text-gray-400 block mb-1">MOTIVO</label><textarea id="ag-desc" rows="3" placeholder="Ej: Cambio de aceite, revisión general..."></textarea></div>
      <button onclick="guardarCita()" class="btn-primary w-full text-center">Agendar Cita</button>
    </div>
  </div>`;
      // Poner fecha mínima = mañana
      const manana = new Date(); manana.setDate(manana.getDate() + 1);
      document.getElementById('ag-fecha').min = manana.toISOString().slice(0, 16);
    }

    async function guardarCita() {
      const fecha = document.getElementById('ag-fecha').value;
      const placa = document.getElementById('ag-placa').value.trim().toUpperCase();
      const desc = document.getElementById('ag-desc').value.trim();
      if (!fecha) { toastErr('Selecciona fecha y hora'); return; }
      const r = await apiFetch('/api/citas/nueva', { method: 'POST', body: JSON.stringify({ fecha, placa, descripcion: desc, cliente_id: S.user?.id }) });
      if (r && r.ok) {
        toastOk('¡Cita solicitada exitosamente! Por favor, espere a que administración la confirme en breve.');
        setPage('mis-citas');
      }
      else toastErr(r?.error || 'Error al agendar');
    }

    // ─── SHEET / MODAL ────────────────────────────────────
    function openSheet(html) {
      closeSheet();
      const overlay = document.createElement('div');
      overlay.id = 'sheet-overlay';
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `<div class="modal-sheet slide-up">
    <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mt-3 mb-1"></div>
    ${html}
  </div>`;
      overlay.addEventListener('click', e => { if (e.target === overlay) closeSheet(); });
      document.body.appendChild(overlay);
    }

    function closeSheet() {
      const el = document.getElementById('sheet-overlay');
      if (el) el.remove();
    }

    // ─── ROUTER ───────────────────────────────────────────
    function renderPage(name) {
      window.scrollTo(0, 0);
      const c = document.getElementById('content');
      c.innerHTML = '';
      switch (name) {
        case 'dashboard': pageDashboard(); break;
        case 'ordenes': pageOrdenes(); break;
        case 'clientes': pageClientes(); break;
        case 'inventario': pageInventario(); break;
        case 'notas': pageNotas(); break;
        case 'mis-ordenes': pageMisOrdenes(); break;
        case 'mis-citas': pageMisCitas(); break;
        case 'agendar': pageAgendar(); break;
        default: c.innerHTML = '<div class="text-center py-10 text-gray-400">Página en desarrollo</div>';
      }
    }

    // ─── ARRANQUE ─────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', async () => {
      if (S.token && S.user) {
        // Verificar token
        try {
          const me = await fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + S.token } });
          if (me.ok) { startApp(); return; }
        } catch (e) { }
      }
      document.getElementById('loading').style.opacity = '0';
      setTimeout(() => {
        const l = document.getElementById('loading');
        if (l) l.remove();
        document.getElementById('login-screen').classList.remove('hidden');
      }, 400);
    });

    // Enter en login
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const ps = document.getElementById('panel-staff');
        if (ps && !ps.classList.contains('hidden')) doLogin('staff');
      }
    });
  </script>
</body>

</html>
